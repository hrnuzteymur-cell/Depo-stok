<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kansan Depo · v30 Final</title>
<meta name="theme-color" content="#1e40af">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="final-mobile.css">
<style>
  :root {
    --bg: #f0f2f5;
    --surface: #ffffff;
    --border: #e2e6ea;
    --ink: #1a1d21;
    --muted: #6b7280;
    --brand: #1e40af;
    --brand-light: #eff6ff;
    --brand-dark: #1e3a8a;
    --green: #15803d;
    --green-bg: #f0fdf4;
    --red: #b91c1c;
    --red-bg: #fef2f2;
    --amber: #92400e;
    --amber-bg: #fffbeb;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
  
  /* Layout */
  .layout { display: flex; height: 100vh; overflow: hidden; }
  
  /* Sidebar */
  .sidebar {
    width: 240px; flex-shrink: 0; background: var(--brand-dark);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sidebar-brand {
    padding: 20px 18px 16px; border-bottom: 1px solid rgba(255,255,255,.1);
  }
  .brand-icon {
    width: 38px; height: 38px; background: #3b82f6; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 17px; color: #fff; margin-bottom: 10px;
  }
  .brand-name { font-weight: 800; font-size: 14px; color: #fff; line-height: 1.2; }
  .brand-sub { font-size: 11px; color: rgba(255,255,255,.5); margin-top: 2px; }
  .sidebar-nav { flex: 1; padding: 10px 10px; overflow-y: auto; }
  .nav-section { margin-bottom: 6px; }
  .nav-label { font-size: 9px; font-weight: 700; color: rgba(255,255,255,.35); letter-spacing: .08em; padding: 8px 8px 4px; text-transform: uppercase; }
  .nav-btn {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 9px 10px; border: 0; background: transparent; color: rgba(255,255,255,.65);
    border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; text-align: left;
    transition: background .15s, color .15s;
  }
  .nav-btn:hover { background: rgba(255,255,255,.08); color: #fff; }
  .nav-btn.active { background: rgba(255,255,255,.15); color: #fff; }
  .nav-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
  .sidebar-footer { padding: 12px 18px; border-top: 1px solid rgba(255,255,255,.1); }
  .ver { font-size: 10px; color: rgba(255,255,255,.3); }
  
  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    height: 56px; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 24px; gap: 12px; flex-shrink: 0;
  }
  .topbar-title { font-weight: 800; font-size: 16px; }
  .topbar-back {
    display: none; align-items: center; gap: 6px; border: 0; background: transparent;
    color: var(--brand); font-size: 13px; font-weight: 700; cursor: pointer; padding: 0;
  }
  .topbar-back.visible { display: flex; }
  .spacer { flex: 1; }
  .page { flex: 1; overflow-y: auto; padding: 20px 24px; }

  /* Cards & Panels */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card-title { font-weight: 800; font-size: 14px; margin-bottom: 14px; }
  .card-sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; margin-top: -10px; }

  /* Dashboard grid */
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .stat-value { font-size: 26px; font-weight: 900; color: var(--ink); line-height: 1; }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 4px; font-weight: 600; }
  .action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .action-btn {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; text-align: left; cursor: pointer; box-shadow: var(--shadow);
    transition: border-color .15s, box-shadow .15s;
  }
  .action-btn:hover { border-color: #93c5fd; box-shadow: 0 4px 12px rgba(30,64,175,.12); }
  .action-btn.primary { background: var(--brand-dark); border-color: var(--brand-dark); color: #fff; }
  .action-btn.primary:hover { background: var(--brand); border-color: var(--brand); }
  .action-icon { font-size: 22px; margin-bottom: 8px; display: block; }
  .action-name { font-weight: 800; font-size: 13px; display: block; }
  .action-desc { font-size: 11px; color: var(--muted); display: block; margin-top: 3px; }
  .action-btn.primary .action-desc { color: rgba(255,255,255,.6); }

  /* Forms */
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 11px; font-weight: 700; color: var(--muted); }
  .field input, .field select, .field textarea {
    width: 100%; border: 1.5px solid var(--border); background: var(--bg); border-radius: 8px;
    padding: 10px 12px; font-size: 14px; color: var(--ink); font-family: inherit; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--brand); background: var(--surface); box-shadow: 0 0 0 3px rgba(30,64,175,.1);
  }
  .field textarea { resize: vertical; min-height: 72px; }
  .fgrid { display: grid; gap: 12px; }
  .g2 { grid-template-columns: 1fr 1fr; }
  .g3 { grid-template-columns: 1fr 1fr 1fr; }
  .g4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 18px; border: 0; border-radius: 8px; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: opacity .15s, background .15s; white-space: nowrap;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--brand-dark); }
  .btn-secondary { background: var(--brand-light); color: var(--brand); }
  .btn-secondary:hover:not(:disabled) { background: #dbeafe; }
  .btn-ghost { background: var(--border); color: var(--ink); }
  .btn-ghost:hover:not(:disabled) { background: #d1d5db; }
  .btn-danger { background: var(--red-bg); color: var(--red); }
  .btn-danger:hover:not(:disabled) { background: #fee2e2; }
  .btn-scan { background: var(--border); color: var(--brand); border-radius: 8px; padding: 10px 13px; font-size: 18px; border: 0; cursor: pointer; flex-shrink: 0; }
  .scan-row { display: flex; gap: 8px; align-items: flex-end; }
  .scan-row .field { flex: 1; }
  .btn-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .big-scan {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%; min-height: 72px; border: 2px dashed #93c5fd; border-radius: 10px;
    background: var(--brand-light); color: var(--brand); font-weight: 800; font-size: 14px;
    cursor: pointer; margin-bottom: 14px; transition: background .15s;
  }
  .big-scan:hover { background: #dbeafe; }
  .big-scan-icon { font-size: 26px; }

  /* Alert messages */
  .alert { padding: 10px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; margin-top: 10px; }
  .alert-success { background: var(--green-bg); color: var(--green); }
  .alert-warn { background: var(--amber-bg); color: var(--amber); }
  .alert-error { background: var(--red-bg); color: var(--red); }
  .alert-info { background: var(--brand-light); color: var(--brand); }

  /* Table */
  .table-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; max-height: 420px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { background: #f8fafc; font-size: 10px; font-weight: 700; color: var(--muted); padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); position: sticky; top: 0; }
  td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f8fafc; }
  .empty-state { text-align: center; padding: 36px 20px; color: var(--muted); font-size: 13px; }
  .empty-icon { font-size: 28px; margin-bottom: 8px; }

  /* Badges */
  .badge { display: inline-flex; padding: 3px 8px; border-radius: 999px; font-size: 10px; font-weight: 800; }
  .badge-in { background: var(--green-bg); color: var(--green); }
  .badge-out { background: var(--red-bg); color: var(--red); }
  .badge-move { background: var(--brand-light); color: var(--brand); }
  .badge-machine { background: var(--amber-bg); color: var(--amber); }

  /* Tag/chip list */
  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; background: var(--brand-light); color: var(--brand); border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 700; }
  .tag-remove { background: transparent; border: 0; color: var(--brand); cursor: pointer; font-size: 15px; line-height: 1; padding: 0; opacity: .6; }
  .tag-remove:hover { opacity: 1; }

  /* Stock detail popup */
  .stock-locs { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .stock-loc-row { display: flex; justify-content: space-between; align-items: center; background: var(--bg); border-radius: 7px; padding: 8px 12px; font-size: 12px; }
  .loc-name { font-weight: 700; }
  .loc-qty { font-weight: 800; color: var(--brand); }

  /* Search result product card */
  .product-result { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px; background: var(--surface); }
  .product-result-name { font-weight: 800; font-size: 14px; margin-bottom: 2px; }
  .product-result-code { font-size: 11px; color: var(--muted); }
  .product-result-stocks { margin-top: 10px; }

  /* Success toast */
  .toast {
    position: fixed; bottom: 24px; right: 24px; background: #1a1d21; color: #fff;
    padding: 12px 18px; border-radius: 10px; font-size: 13px; font-weight: 700;
    z-index: 9999; transform: translateY(100px); opacity: 0; transition: transform .25s, opacity .25s;
    max-width: 320px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* Camera overlay */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.93); z-index: 99999;
    display: flex; flex-direction: column; padding: 20px; color: #fff;
  }
  .overlay-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .overlay-title { font-weight: 800; font-size: 16px; }
  .overlay-close { background: rgba(255,255,255,.1); border: 0; color: #fff; border-radius: 7px; padding: 8px 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .overlay video { width: 100%; flex: 1; object-fit: cover; border-radius: 12px; background: #111; min-height: 0; }
  .overlay-msg { font-size: 12px; color: rgba(255,255,255,.6); padding: 10px 0 4px; }
  .overlay-actions { display: flex; gap: 8px; margin-top: 10px; }
  .overlay-actions .btn { flex: 1; }
  .overlay-bar { height: 4px; background: rgba(255,255,255,.15); border-radius: 999px; margin-top: 6px; overflow: hidden; }
  .overlay-bar-fill { height: 100%; background: #3b82f6; width: 0; transition: width .2s; }

  /* Mobile bottom nav */
  .bottom-nav { display: none; }
  
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .stat-grid { grid-template-columns: 1fr 1fr; }
    .action-grid { grid-template-columns: 1fr 1fr; }
    .g3, .g4 { grid-template-columns: 1fr 1fr; }
    .g2 { grid-template-columns: 1fr; }
    .page { padding: 14px 14px 80px; }
    .topbar { padding: 0 14px; }
    .bottom-nav {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--brand-dark); padding: 8px 8px 12px; gap: 4px;
      z-index: 100; border-top: 1px solid rgba(255,255,255,.1);
    }
    .bottom-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 6px 4px; border: 0; background: transparent; color: rgba(255,255,255,.5);
      font-size: 8px; font-weight: 700; border-radius: 7px; cursor: pointer;
    }
    .bottom-btn .bi { font-size: 18px; }
    .bottom-btn.active { background: rgba(255,255,255,.12); color: #fff; }
    .toast { bottom: 76px; right: 12px; left: 12px; max-width: none; }
  }
  @media (max-width: 480px) {
    .action-grid { grid-template-columns: 1fr 1fr; }
    .stat-grid { grid-template-columns: 1fr 1fr; }
    .g3, .g4, .g2 { grid-template-columns: 1fr; }
  }

  /* v16 — mobil sabit ekran, çakışma ve güvenli alan düzeltmeleri */
  .layout { height: 100dvh; min-height: 100dvh; }
  .main { min-width: 0; min-height: 0; }
  .page { min-height: 0; overflow: hidden; }
  .page-shell { height: 100%; min-height: 0; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .page-shell > .card { margin-bottom: 0; }
  .page-shell > .card:last-child { min-height: 0; }
  .page-shell .table-wrap { min-height: 0; }
  .page-products > .card:last-child,
  .page-shelves > .card:last-child,
  .page-machines-def > .card:last-child,
  .page-movements > .card:last-child,
  .page-receiving > .card:last-child { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .page-products > .card:last-child .table-wrap,
  .page-shelves > .card:last-child .table-wrap,
  .page-movements > .card:last-child .table-wrap,
  .page-receiving > .card:last-child .table-wrap { flex: 1; min-height: 0; overflow: auto; }

  @media (max-width: 768px) {
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    .topbar { height: 52px; min-height: 52px; padding: 0 12px; }
    .topbar-title { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .topbar-back { flex-shrink: 0; }
    .page { padding: 10px 10px max(10px, env(safe-area-inset-bottom)); overflow: hidden; }
    .bottom-nav { display: none !important; }
    .card { padding: 12px; border-radius: 10px; }
    .card-title { margin-bottom: 9px; font-size: 13px; }
    .card-sub { margin: -5px 0 9px; font-size: 10px; }
    .stat-grid { grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; margin-bottom: 8px; }
    .stat { padding: 9px 7px; min-width: 0; }
    .stat-value { font-size: 18px; }
    .stat-label { font-size: 8px; line-height: 1.15; }
    .action-grid { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, minmax(0,1fr)); gap: 7px; margin-bottom: 0; flex: 1; min-height: 0; }
    .action-btn { padding: 10px; min-height: 0; overflow: hidden; }
    .action-icon { font-size: 17px; margin-bottom: 4px; }
    .action-name { font-size: 12px; line-height: 1.1; }
    .action-desc { font-size: 9px; line-height: 1.15; margin-top: 2px; }
    .fgrid { gap: 7px; }
    .g2, .g3, .g4 { grid-template-columns: 1fr 1fr; }
    .field { gap: 3px; min-width: 0; }
    .field label { font-size: 9px; }
    .field input, .field select, .field textarea { padding: 8px 9px; min-height: 36px; font-size: 13px; }
    .field textarea { min-height: 50px; max-height: 70px; }
    .btn { padding: 8px 11px; font-size: 12px; }
    .btn-row { margin-top: 8px; gap: 6px; }
    .btn-scan { padding: 8px 10px; font-size: 16px; }
    .big-scan { min-height: 52px; margin-bottom: 9px; font-size: 13px; }
    .big-scan-icon { font-size: 20px; }
    .alert { padding: 7px 9px; font-size: 10px; margin-top: 6px !important; }
    .table-wrap { max-height: none; }
    table { font-size: 10px; }
    th { font-size: 8px; padding: 6px 7px; }
    td { padding: 6px 7px; }
    .toast { bottom: max(12px, env(safe-area-inset-bottom)); right: 10px; left: 10px; }
    .overlay { padding: 10px 10px max(10px, env(safe-area-inset-bottom)); }
    .overlay-head { margin-bottom: 8px; }
    .overlay video { border-radius: 9px; }
    .page-dashboard .card.recent-card { display: none; }
    .page-products { gap: 7px; }
    .page-products > .card:first-child { flex: 0 0 auto; }
    .page-products .pending-card { flex: 0 0 auto; }
    .page-products .pending-card .btn-row { display:none; }
    .page-products .pending-card .fgrid { grid-template-columns: 1fr 1fr 1fr; }
    .page-products .pending-card .card-title { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .page-products > .card:last-child { flex:1; }
  }
  @media (max-width: 430px) and (max-height: 760px) {
    .page { padding: 7px; }
    .card { padding: 9px; }
    .stat-grid { display:none; }
    .action-grid { grid-template-rows: repeat(4, minmax(0,1fr)); }
    .action-desc { display:none; }
    .action-icon { margin-bottom:2px; }
    .page-products .big-scan { min-height: 44px; }
    .page-products .pending-card { padding:8px; }
    .page-products .pending-badge { display:none; }
    .field input, .field select { min-height: 32px; padding: 6px 7px; }
    .btn { padding: 6px 8px; }
  }

  /* Export/Import section */
  .data-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .divider { height: 1px; background: var(--border); margin: 14px 0; }
  
  /* Pending placement highlight */
  .pending-card { border: 2px solid #3b82f6; background: var(--brand-light); }
  .pending-badge { display: inline-flex; background: var(--brand); color: #fff; border-radius: 5px; padding: 3px 8px; font-size: 10px; font-weight: 800; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="layout">
  <!-- Sidebar (desktop) -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">K</div>
      <div class="brand-name">Kansan Depo</div>
      <div class="brand-sub">Stok & Lokasyon Yönetimi</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-label">Genel</div>
        <button class="nav-btn active" data-page="dashboard"><span class="nav-icon">🏠</span> Ana Sayfa</button>
        <button class="nav-btn" data-page="search"><span class="nav-icon">🔍</span> Ürün Ara</button>
        <button class="nav-btn" data-page="movements"><span class="nav-icon">📋</span> Hareketler</button>\n        <button class="nav-btn" data-page="reports"><span class="nav-icon">📊</span> Raporlar</button>
        <button class="nav-btn" data-page="count"><span class="nav-icon">🧮</span> Sayım</button>
      </div>
      <div class="nav-section">
        <div class="nav-label">Ürün & Stok</div>
        <button class="nav-btn" data-page="products"><span class="nav-icon">📦</span> Ürünler</button>
        <button class="nav-btn" data-page="entry"><span class="nav-icon">➕</span> Stok Girişi</button>
        <button class="nav-btn" data-page="transfer"><span class="nav-icon">🔄</span> Raf Transferi</button>
        <button class="nav-btn" data-page="machine"><span class="nav-icon">⚙️</span> Makineye Çıkış</button>
      </div>
      <div class="nav-section">
        <div class="nav-label">Tanımlar</div>
        <button class="nav-btn" data-page="shelves"><span class="nav-icon">🗂️</span> Raf Yönetimi</button>
        <button class="nav-btn" data-page="machines-def"><span class="nav-icon">🏭</span> Makineler</button>
        <button class="nav-btn" data-page="settings"><span class="nav-icon">⚙️</span> Ayarlar</button>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="ver">Kansan Depo v30</div>
    </div>
  </aside>

  <!-- Main content -->
  <div class="main">
    <header class="topbar">
      <button class="topbar-back" id="backBtn" onclick="goBack()">← Geri</button>
      <span class="topbar-title" id="topbarTitle">Ana Sayfa</span>
      <div class="spacer"></div>
      <span id="topbarExtra"></span>
    </header>
    <div class="page" id="page"></div>
  </div>

  <!-- Bottom nav (mobile) -->
  <nav class="bottom-nav">
    <button class="bottom-btn active" data-page="dashboard"><span class="bi">🏠</span>Ana</button>
    <button class="bottom-btn" data-page="products"><span class="bi">📦</span>Ürün</button>
    <button class="bottom-btn" data-page="entry"><span class="bi">➕</span>Giriş</button>
    <button class="bottom-btn" data-page="search"><span class="bi">🔍</span>Ara</button>
    <button class="bottom-btn" data-page="transfer"><span class="bi">🔄</span>Transfer</button>
    <button class="bottom-btn" data-page="movements"><span class="bi">📋</span>Log</button>
  </nav>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="count.js"></script>\n<script src="reports.js"></script>\n<script src="pwa.js"></script>\n<script src="cloud-config.js"></script>
<script>
// ─── State ───────────────────────────────────────────────────────────────────
const KEY = 'kansan-depo-v3';
function loadState() {
  try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; }
}
const raw = loadState();
const state = {
  products: [],
  stock: [],
  movements: [],
  machines: [],
  shelves: [],
  page: 'dashboard',
  pendingCode: '',
  ...raw
};
// Sanitize
if (!Array.isArray(state.products)) state.products = [];
if (!Array.isArray(state.stock)) state.stock = [];
if (!Array.isArray(state.movements)) state.movements = [];
if (!Array.isArray(state.machines)) state.machines = [];
if (!Array.isArray(state.shelves)) state.shelves = [];
state.products = state.products.map(p => ({
  ...p,
  productCode: String(p.productCode || p.barcode || p.code || '').trim(),
  description: String(p.description || p.name || '').trim()
})).filter(p => p.productCode);
state.stock = state.stock.map(s => ({
  ...s,
  barcode: String(s.barcode || s.productCode || '').trim(),
  location: String(s.location || '').toUpperCase().trim(),
  qty: Number(s.qty) || 0
})).filter(s => s.qty > 0);
state.shelves = [...new Set(state.shelves.map(x => String(x).trim().toUpperCase()).filter(Boolean))].sort();
state.machines = [...new Set(state.machines.map(x => String(x).trim().toUpperCase()).filter(Boolean))];

// v17: Mal Kabul / TB modülü kaldırıldı; eski TB taslak alanları artık kullanılmaz.
delete state.transportUnits;
delete state.receivingDraft;

function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
save();

// ─── Helpers ─────────────────────────────────────────────────────────────────
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function uid() { return Date.now() + '-' + Math.random().toString(36).slice(2, 7); }
function now() { return new Date().toLocaleString('tr-TR'); }
function num(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }
function pBy(code) { code = String(code || '').trim(); return state.products.find(p => p.productCode === code); }
function qtyAt(code, loc) {
  return state.stock
    .filter(s => s.barcode === code && s.location === loc)
    .reduce((sum, s) => sum + s.qty, 0);
}
function totalQty(code) {
  return state.stock
    .filter(s => s.barcode === code)
    .reduce((sum, s) => sum + s.qty, 0);
}
function addStock(code, loc, q) {
  let s = state.stock.find(s => s.barcode === code && s.location === loc);
  if (s) s.qty += q; else state.stock.push({ id: uid(), barcode: code, location: loc, qty: q });
}
function remStock(code, loc, q) {
  const EPS = 1e-9;
  const available = qtyAt(code, loc);
  if (!Number.isFinite(q) || q <= 0 || available + EPS < q) return false;
  let remaining = q;
  for (const row of state.stock.filter(s => s.barcode === code && s.location === loc)) {
    if (remaining <= EPS) break;
    const take = Math.min(row.qty, remaining);
    row.qty -= take;
    remaining -= take;
  }
  state.stock = state.stock.filter(s => s.qty > EPS);
  return remaining <= EPS;
}
function logMovement(type, code, q, from, to, machine, note) {
  const p = pBy(code);
  state.movements.unshift({ id: uid(), date: now(), type, barcode: code, productName: p?.description || '', qty: q, from: from || '', to: to || '', machine: machine || '', note: note || '' });
}
function shelfOpts(selected = '', extra = '') {
  if (!state.shelves.length) return '<option value="">— Önce raf tanımlayın —</option>';
  return `<option value="">${extra || '— Raf seçin —'}</option>` +
    state.shelves.map(r => `<option value="${esc(r)}"${r === selected ? ' selected' : ''}>${esc(r)}</option>`).join('');
}
function machineOpts(selected = '') {
  if (!state.machines.length) return '<option value="">— Önce makine tanımlayın —</option>';
  return `<option value="">— Makine seçin —</option>` +
    state.machines.map(m => `<option value="${esc(m)}"${m === selected ? ' selected' : ''}>${esc(m)}</option>`).join('');
}

// ─── Toast ────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = (type === 'ok' ? '✓ ' : type === 'err' ? '✕ ' : 'ℹ ') + msg;
  el.style.background = type === 'ok' ? '#15803d' : type === 'err' ? '#b91c1c' : '#1e40af';
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

  dashboard: 'Ana Sayfa', products: 'Ürünler', entry: 'Stok Girişi',

  count: 'Stok Sayımı', reports: 'Stok Raporları', settings: 'Ayarlar'
};
function goPage(p, fromHistory = false) {
  if (!PAGE_TITLES[p]) p = 'dashboard';
  if (!fromHistory && state.page !== p) history.pushState({ page: p }, '', location.href);
  state.page = p;
  save();
  renderPage();
}
function goBack() {
  if (scanOverlay) { history.back(); return; }
  if (state.page !== 'dashboard') history.back();
  else goPage('dashboard', true);
}
window.goPage = goPage;
window.goBack = goBack;

window.addEventListener('popstate', (e) => {
  if (scanOverlay) { closeScanner(true); return; }
  const p = e.state?.page || 'dashboard';
  state.page = PAGE_TITLES[p] ? p : 'dashboard';
  save();
  renderPage();
});

function renderPage() {
  const title = PAGE_TITLES[state.page] || state.page;
  document.getElementById('topbarTitle').textContent = title;
  document.getElementById('backBtn').classList.toggle('visible', state.page !== 'dashboard');
  document.querySelectorAll('[data-page]').forEach(b => b.classList.toggle('active', b.dataset.page === state.page));
  const pages = { dashboard: renderDashboard, products: renderProducts, entry: renderEntry, search: renderSearch, shelves: renderShelves, 'machines-def': renderMachinesDef, transfer: renderTransfer, machine: renderMachine, movements: renderMovements, count: window.renderCount, reports: window.renderReports, settings: renderSettings };
  const fn = pages[state.page] || renderDashboard;

}

  else { state.products.push({ id: uid(), productCode: code, barcode: code, code, description: desc, name: desc, unit }); toast('Ürün kaydedildi'); }

}

function saveProductAndGoEntry() {
  const code = document.getElementById('pCode').value.trim();

  const unit = document.getElementById('pUnit').value;
  if (!code) { toast('Ürün kodu gerekli', 'err'); return; }
  if (!desc) { toast('Ürün tanımı gerekli', 'err'); return; }
  let p = pBy(code);

// ─── SEARCH ──────────────────────────────────────────────────────────────────
function productLocations(code) {
  const grouped = new Map();
  state.stock.filter(s => s.barcode === code && s.qty > 0).forEach(s => {
    grouped.set(s.location, (grouped.get(s.location) || 0) + s.qty);
  });
  return [...grouped.entries()]
    .map(([location, qty]) => ({ location, qty }))
    .sort((a, b) => a.location.localeCompare(b.location, 'tr'));
}

function renderSearch() {
  return `
  <div class="card">
    <div class="card-title">Ürün Bul</div>
    <div class="card-sub">Ürün barkodunu okutun veya ürün kodu / açıklaması ile arayın. Ürünün bulunduğu tüm raflar ve her raftaki miktarı gösterilir.</div>
    <div class="fgrid g2">
      <div class="scan-row">
        <div class="field" style="flex:1"><input id="sQuery" placeholder="Ürün kodu veya açıklaması..." oninput="doSearch()" autocomplete="off"></div>
        <button class="btn-scan" onclick="scanToInput('sQuery', doSearch)" title="Ürün barkodunu tara">📷</button>
      </div>
      <button class="btn btn-primary" onclick="doSearch()" style="align-self:flex-end">Ara</button>
    </div>
  </div>
  <div id="sResult"></div>`;
}

function doSearch() {
  const raw = (document.getElementById('sQuery')?.value || '').trim();
  const q = raw.toLowerCase();
  const results = document.getElementById('sResult');
  if (!results) return;
  if (!q) { results.innerHTML = ''; return; }

  const exact = state.products.find(p => p.productCode.toLowerCase() === q);
  const matches = exact ? [exact] : state.products.filter(p =>
    p.productCode.toLowerCase().includes(q) || p.description.toLowerCase().includes(q)
  );

  if (!matches.length) {
    results.innerHTML = '<div class="card"><div class="empty-state"><div class="empty-icon">🔍</div>Ürün bulunamadı.</div></div>';
    return;
  }

  results.innerHTML = matches.map(p => {
    const locs = productLocations(p.productCode);
    const total = locs.reduce((sum, s) => sum + s.qty, 0);
    const unit = p.unit || 'Adet';
    return `
    <div class="product-result">
      <div class="product-result-name">${esc(p.description)}</div>
      <div class="product-result-code">${esc(p.productCode)} · ${esc(unit)}</div>
      <div style="margin-top:10px;font-size:12px"><b>Toplam stok: ${total.toLocaleString('tr-TR')} ${esc(unit)}</b></div>
      <div class="product-result-stocks">
        ${locs.length ? `
          <div class="stock-locs">
            ${locs.map(s => `<div class="stock-loc-row"><span class="loc-name">📍 ${esc(s.location)}</span><span class="loc-qty">${s.qty.toLocaleString('tr-TR')} ${esc(unit)}</span></div>`).join('')}
          </div>` : '<div class="alert alert-warn">Bu ürün için raf stoğu bulunmuyor.</div>'}
      </div>
    </div>`;
  }).join('');
}
window.doSearch = doSearch;

// ─── SHELVES ─────────────────────────────────────────────────────────────────
function shelfInventory(r) {
  const grouped = new Map();
  state.stock.filter(s => s.location === r && s.qty > 0).forEach(s => {
    grouped.set(s.barcode, (grouped.get(s.barcode) || 0) + s.qty);
  });
  return [...grouped.entries()].map(([code, qty]) => {
    const p = pBy(code);
    return { code, qty, description: p?.description || 'Ürün açıklaması yok', unit: p?.unit || 'Adet' };
  }).sort((a, b) => a.description.localeCompare(b.description, 'tr'));
}

function onTransferCodeChange() {

    info.style.display = '';
    onTransferFromChange();
  } else {
    info.className = 'alert alert-warn';
    info.textContent = 'Ürün kayıtlı değil.';
    info.style.display = '';
  }
}
window.onTransferCodeChange = onTransferCodeChange;

function onTransferFromChange() {
  const code = document.getElementById('tCode')?.value.trim();
  const from = document.getElementById('tFrom')?.value;
  const shelfInfo = document.getElementById('tShelfInfo');
  if (!shelfInfo) return;
  if (!code || !from) { shelfInfo.style.display = 'none'; return; }
  const q = qtyAt(code, from);
  if (q > 0) {
    shelfInfo.className = 'alert alert-success';
    shelfInfo.textContent = `${from} rafında ${q} adet mevcut.`;
  } else {
    shelfInfo.className = 'alert alert-error';
    shelfInfo.textContent = `${from} rafında bu üründen stok yok.`;
  }
  shelfInfo.style.display = '';
}
window.onTransferFromChange = onTransferFromChange;

function transferStock(code, from, to, q) {
  const EPS = 1e-9;
  if (!pBy(code)) return { ok: false, error: 'Ürün kayıtlı değil' };
  if (!state.shelves.includes(from)) return { ok: false, error: 'Kaynak raf kayıtlı değil' };
  if (!state.shelves.includes(to)) return { ok: false, error: 'Hedef raf kayıtlı değil' };
  if (from === to) return { ok: false, error: 'Kaynak ve hedef aynı olamaz' };
  if (!Number.isFinite(q) || q <= 0) return { ok: false, error: 'Miktar sıfırdan büyük olmalı' };

  const sourceBefore = qtyAt(code, from);
  const targetBefore = qtyAt(code, to);
  const totalBefore = totalQty(code);
  if (sourceBefore + EPS < q) return { ok: false, error: `${from} rafında yeterli stok yok` };

  const stockBefore = state.stock.map(s => ({ ...s }));
  if (!remStock(code, from, q)) return { ok: false, error: `${from} rafında yeterli stok yok` };
  addStock(code, to, q);

  const sourceAfter = qtyAt(code, from);
  const targetAfter = qtyAt(code, to);
  const totalAfter = totalQty(code);
  const valid =
    Math.abs(sourceAfter - (sourceBefore - q)) <= EPS &&
    Math.abs(targetAfter - (targetBefore + q)) <= EPS &&
    Math.abs(totalAfter - totalBefore) <= EPS;

  if (!valid) {
    state.stock = stockBefore;
    return { ok: false, error: 'Transfer stok kontrolü başarısız. İşlem geri alındı.' };
  }
  return { ok: true, totalBefore, totalAfter };
}
window.transferStock = transferStock;

function transferSave() {
  const code = document.getElementById('tCode').value.trim();
  const from = document.getElementById('tFrom').value;
  const to = document.getElementById('tTo').value;

  if (!to) { toast('Hedef raf seçin', 'err'); return; }
  const result = transferStock(code, from, to, q);
  if (!result.ok) { toast(result.error, 'err'); return; }
  logMovement('TRANSFER', code, q, from, to);
  save();
  const unit = pBy(code)?.unit || 'Adet';
  toast(`${q} ${unit} → ${from} ▸ ${to}`);
  document.getElementById('tCode').value = '';
  document.getElementById('tQty').value = '';
  const inf = document.getElementById('tInfo'); if (inf) inf.style.display = 'none';
  const si = document.getElementById('tShelfInfo'); if (si) si.style.display = 'none';
}

function issueToMachine(code, machine, from, q) {
  const EPS = 1e-9;
  if (!pBy(code)) return { ok: false, error: 'Ürün kayıtlı değil' };
  if (!state.machines.includes(machine)) return { ok: false, error: 'Makine kayıtlı değil' };
  if (!state.shelves.includes(from)) return { ok: false, error: 'Çıkış rafı kayıtlı değil' };
  if (!Number.isFinite(q) || q <= 0) return { ok: false, error: 'Miktar sıfırdan büyük olmalı' };

  const sourceBefore = qtyAt(code, from);
  const totalBefore = totalQty(code);
  if (sourceBefore + EPS < q) return { ok: false, error: `${from} rafında yeterli stok yok` };

  const stockBefore = state.stock.map(row => ({ ...row }));
  if (!remStock(code, from, q)) return { ok: false, error: `${from} rafında yeterli stok yok` };

  const sourceAfter = qtyAt(code, from);
  const totalAfter = totalQty(code);
  const valid =
    Math.abs(sourceAfter - (sourceBefore - q)) <= EPS &&
    Math.abs(totalAfter - (totalBefore - q)) <= EPS;

  if (!valid) {
    state.stock = stockBefore;
    return { ok: false, error: 'Makine çıkışı stok kontrolü başarısız. İşlem geri alındı.' };
  }
  return { ok: true, totalBefore, totalAfter };
}

}

function filteredMovements() {
  const filter = state._moveFilter || 'ALL';
  const query = String(state._moveSearch || '').trim().toLocaleLowerCase('tr-TR');

    if (filter !== 'ALL' && m.type !== filter) return false;
    if (!query) return true;
    return [m.date, m.type, m.barcode, m.productName, m.from, m.to, m.machine, m.note]
      .some(v => String(v || '').toLocaleLowerCase('tr-TR').includes(query));
  });

function exportMovementsCsv() {
  const rows = filteredMovements();
  if (!rows.length) { toast('Dışa aktarılacak hareket yok', 'err'); return; }
  const csvCell = value => `"${String(value ?? '').replace(/"/g, '""')}"`;
  const header = ['Tarih','İşlem','Ürün Kodu','Ürün Adı','Miktar','Kaynak','Hedef','Makine','Not'];
  const lines = [header, ...rows.map(m => [m.date,m.type,m.barcode,m.productName,m.qty,m.from,m.to,m.machine,m.note])]
    .map(row => row.map(csvCell).join(';'));
  const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `kansan-hareketler-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}
window.exportMovementsCsv = exportMovementsCsv;

      <button class="btn btn-secondary" onclick="restoreSafetyBackup()" ${backups.length ? '' : 'disabled'}>↩️ Son Yedeği Geri Yükle</button>
    </div>
    <div class="alert alert-info">İçe aktarma, geri yükleme ve sıfırlama öncesinde mevcut verilerin otomatik güvenlik yedeği alınır. Son 5 yedek saklanır.</div>
    <div class="divider"></div>
    <div class="card-title">Güvenlik Yedeği Geçmişi</div>
    <div class="stock-locs">${history}</div>
    <div class="divider"></div>
    <div class="fgrid g2">
      <div class="stat" style="text-align:center">
        <div class="stat-value">${JSON.stringify(state).length / 1024 | 0} KB</div>
        <div class="stat-label">Veri Boyutu</div>
      </div>
      <div class="stat" style="text-align:center">
        <div class="stat-value">${state.products.length + state.stock.length + state.movements.length}</div>
        <div class="stat-label">Toplam Kayıt</div>
      </div>
    </div>
    <div class="divider"></div>
    <button class="btn btn-danger" onclick="resetAll()">🗑️ Tüm Verileri Sıfırla</button>
  </div>
  <div class="card">
    <div class="card-title">Uygulama Hakkında</div>
    <p style="font-size:13px;color:var(--muted);line-height:1.6">
      <b>Kansan Depo v30</b><br>
      Stok ve lokasyon yönetim sistemi.<br>
      Ürün kaydı, barkod tarama, stok girişi, raf yönetimi, transfer ve makine çıkışı desteklenir.<br>
      Tüm veriler tarayıcınıza kaydedilir.
    </p>
  </div>`;
}

const SAFETY_BACKUP_HISTORY_KEY = KEY + '-safety-backups';
const LEGACY_SAFETY_BACKUP_KEY = KEY + '-safety-backup';
const MAX_SAFETY_BACKUPS = 5;

function snapshotState() {
  return JSON.parse(JSON.stringify(state));
}

function backupSummary(data) {
  return {
    products: Array.isArray(data?.products) ? data.products.length : 0,
    stock: Array.isArray(data?.stock) ? data.stock.length : 0,
    movements: Array.isArray(data?.movements) ? data.movements.length : 0
  };
}

function exportData() {
  const data = snapshotState();
  const payload = {
    format: 'kansan-depo-backup',
    version: 2,
    exportedAt: new Date().toISOString(),
    summary: backupSummary(data),
    data
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  const url = URL.createObjectURL(blob);
  a.href = url;
  a.download = `kansan-depo-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('JSON yedeği indirildi');
}
window.exportData = exportData;

function validateBackup(input) {
  const data = input?.format === 'kansan-depo-backup' ? input.data : input;
  if (!data || typeof data !== 'object') return { ok: false, error: 'Yedek içeriği geçersiz' };
  const required = ['products','stock','movements','machines','shelves'];
  for (const key of required) {
    if (!Array.isArray(data[key])) return { ok: false, error: `${key} listesi bulunamadı` };
  }
  const productCodes = new Set();
  for (const product of data.products) {
    const code = String(product?.productCode || product?.barcode || product?.code || '').trim();
    if (!code) return { ok: false, error: 'Ürün kodu eksik bir kayıt var' };
    if (productCodes.has(code)) return { ok: false, error: `Tekrarlanan ürün kodu: ${code}` };
    productCodes.add(code);
  }
  for (const row of data.stock) {
    const code = String(row?.barcode || row?.productCode || '').trim();
    const location = String(row?.location || '').trim();
    const qty = Number(row?.qty);
    if (!productCodes.has(code)) return { ok: false, error: `Stoğu bulunan ürün kayıtlı değil: ${code || '?'}` };
    if (!location) return { ok: false, error: `Rafı eksik stok kaydı: ${code}` };
    if (!Number.isFinite(qty) || qty <= 0) return { ok: false, error: `Geçersiz stok miktarı: ${code}` };
  }
  return { ok: true, data };
}

function getSafetyBackups() {
  let backups = [];
  try {
    const parsed = JSON.parse(localStorage.getItem(SAFETY_BACKUP_HISTORY_KEY) || '[]');
    if (Array.isArray(parsed)) backups = parsed;
  } catch {}

  try {
    const legacyRaw = localStorage.getItem(LEGACY_SAFETY_BACKUP_KEY);
    if (legacyRaw) {
      const legacy = JSON.parse(legacyRaw);
      const createdAt = legacy.createdAt || new Date().toISOString();
      if (!backups.some(item => item.createdAt === createdAt)) {
        const data = legacy.data || legacy;
        backups.push({
          id: `legacy-${Date.parse(createdAt) || Date.now()}`,
          createdAt,
          reason: 'legacy',
          summary: backupSummary(data),
          data
        });
        backups = backups.slice(-MAX_SAFETY_BACKUPS);
        localStorage.setItem(SAFETY_BACKUP_HISTORY_KEY, JSON.stringify(backups));
      }
      localStorage.removeItem(LEGACY_SAFETY_BACKUP_KEY);
    }
  } catch {}

  return backups
    .filter(item => item && item.id && item.data)
    .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)))
    .slice(0, MAX_SAFETY_BACKUPS);
}

function createSafetyBackup(reason = 'manual') {
  const data = snapshotState();
  const backup = {
    id: `backup-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
    createdAt: new Date().toISOString(),
    reason,
    summary: backupSummary(data),
    data
  };
  const backups = [backup, ...getSafetyBackups()].slice(0, MAX_SAFETY_BACKUPS);
  localStorage.setItem(SAFETY_BACKUP_HISTORY_KEY, JSON.stringify(backups));
  return backup;
}

function createManualBackup() {
  createSafetyBackup('manual');
  toast('Güvenlik yedeği oluşturuldu');
  renderPage();
}
window.createManualBackup = createManualBackup;

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const parsed = JSON.parse(ev.target.result);
      const checked = validateBackup(parsed);
      if (!checked.ok) { toast(checked.error, 'err'); return; }
      createSafetyBackup('import');
      Object.assign(state, checked.data);
      save(); toast('Veriler içe aktarıldı'); renderPage();
    } catch { toast('Dosya okunamadı', 'err'); }
    finally { e.target.value = ''; }
  };
  reader.readAsText(file);
}
window.importData = importData;

function restoreSafetyBackup(backupId = '') {
  const backups = getSafetyBackups();
  const backup = backupId ? backups.find(item => item.id === backupId) : backups[0];
  if (!backup) { toast('Güvenlik yedeği bulunamadı', 'err'); return; }
  const checked = validateBackup(backup.data);
  if (!checked.ok) { toast(checked.error, 'err'); return; }
  const date = new Date(backup.createdAt);
  const dateText = Number.isNaN(date.getTime()) ? 'seçili' : date.toLocaleString('tr-TR');
  if (!confirm(`${dateText} tarihli yedek geri yüklensin mi? Mevcut veriler önce otomatik yedeklenecek.`)) return;
  createSafetyBackup('restore');
  Object.assign(state, checked.data);
  save(); toast('Güvenlik yedeği geri yüklendi'); renderPage();
}
window.restoreSafetyBackup = restoreSafetyBackup;

function resetAll() {
  if (!confirm('TÜM veriler (ürünler, stok, hareketler) kalıcı olarak silinecek. Emin misiniz?')) return;
  if (!confirm('Son onay: Mevcut veriler güvenlik yedeğine alındıktan sonra silinecek.')) return;
  createSafetyBackup('reset');
  Object.assign(state, { products: [], stock: [], movements: [], machines: [], shelves: [], pendingCode: '' });
  save(); toast('Tüm veriler sıfırlandı; önceki durum yedeklendi'); renderPage();
}
window.resetAll = resetAll;

// ─── CAMERA / SCANNER ─────────────────────────────────────────────────────────
let scanStream = null, scanOverlay = null, scanTimer = null;

function closeScanner(fromHistory = false) {
  clearInterval(scanTimer); scanTimer = null;
  if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
  if (scanOverlay) { scanOverlay.remove(); scanOverlay = null; }
}

async function openCamera(title, withCapture = false) {
  closeScanner();
  if (!navigator.mediaDevices?.getUserMedia) throw new Error('Bu tarayıcı kamera desteklemiyor.');
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="overlay-head">
      <span class="overlay-title">${esc(title)}</span>
      <button class="overlay-close" id="scanClose">Kapat</button>
    </div>
    <video id="scanVideo" autoplay playsinline></video>
    <div class="overlay-msg" id="scanMsg">Kamerayı etikete yaklaştırın.</div>
    ${withCapture ? '<div class="overlay-bar"><div class="overlay-bar-fill" id="ocrBar"></div></div><div class="overlay-actions"><button class="btn btn-primary" id="captureBtn">📷 Etiketi Tara</button></div>' : ''}
  `;
  document.body.appendChild(ov);
  scanOverlay = ov;
  document.getElementById('scanClose').onclick = () => closeScanner(false);
  scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
  document.getElementById('scanVideo').srcObject = scanStream;
  return ov;
}

async function detectBarcode(source) {
  if (!('BarcodeDetector' in window)) return '';
  try { const det = new BarcodeDetector(); const r = await det.detect(source); return r?.[0]?.rawValue || ''; }
  catch { return ''; }
}

async function scanBarcodeValue(title) {
  await openCamera(title, false);
  const video = document.getElementById('scanVideo');
  return new Promise((resolve, reject) => {
    let tries = 0;
    scanTimer = setInterval(async () => {
      tries++;
      const v = await detectBarcode(video);
      if (v) { closeScanner(true); resolve(v); }
      else if (tries > 120) { closeScanner(true); reject(new Error('Barkod okunamadı. Tekrar deneyin.')); }
    }, 250);
  });
}

async function scanToInput(id, callback) {
  try {
    const v = await scanBarcodeValue('Barkod Tara');
    const el = document.getElementById(id);
    if (el) { el.value = v; if (callback) callback(); }
  } catch (e) { toast(e.message, 'err'); }
}
window.scanToInput = scanToInput;

async function scanShelfToSelect(id) {
  try {
    const v = (await scanBarcodeValue('Raf Barkodunu Tara')).trim().toUpperCase();
    const el = document.getElementById(id);
    if (!el) return;
    if (!state.shelves.includes(v)) {
      if (confirm(`"${v}" rafı kayıtlı değil. Eklensin mi?`)) {
        state.shelves.push(v); state.shelves.sort(); save();
        el.innerHTML = shelfOpts(v); el.value = v;
        toast('Raf eklendi: ' + v);
      }
    } else { el.value = v; }
  } catch (e) { toast(e.message, 'err'); }
}
window.scanShelfToSelect = scanShelfToSelect;

// Tesseract (OCR)
let tesseractLoading = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  if (tesseractLoading) return tesseractLoading;
  tesseractLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = () => resolve(window.Tesseract);
    s.onerror = () => reject(new Error('OCR yüklenemedi.'));
    document.head.appendChild(s);
  });
  return tesseractLoading;
}

function isJunk(line) {
  line = String(line || '').trim();
  if (!line || line.length < 2) return true;
  if (/^(barkod|barcode|raf kodu|raf|tarih|date)/i.test(line)) return true;
  if (/\b\d{1,2}[.\-/]\d{1,2}[.\-/]\d{2,4}\b/.test(line)) return true;
  return false;
}
function normCode(v) { return String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function extractDesc(text, code) {
  const lines = String(text || '').split(/\r?\n/).map(x => x.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const cn = normCode(code);
  const ci = lines.findIndex(l => { const n = normCode(l); return cn && (n === cn || n.includes(cn)); });
  if (ci >= 0) {
    for (let i = ci + 1; i < Math.min(lines.length, ci + 4); i++) {
      const l = lines[i];
      if (!isJunk(l) && normCode(l) !== cn && /[A-ZÇĞİÖŞÜa-zçğışöü]{3,}/.test(l)) return l.trim();
    }
  }
  return '';
}

async function scanProductLabel() {
  try {
    await openCamera('Ürün Etiketini Tara', true);
    const video = document.getElementById('scanVideo');
    const msg = document.getElementById('scanMsg');
    const btn = document.getElementById('captureBtn');
    const bar = document.getElementById('ocrBar');
    msg.textContent = 'Etiketin tamamını net gösterin, sonra butona basın.';
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = 'İşleniyor...';
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      let code = await detectBarcode(canvas);
      try {
        const T = await loadTesseract();
        const res = await T.recognize(canvas, 'tur+eng', { logger: m => { if (m.status === 'recognizing text' && bar) bar.style.width = Math.round((m.progress || 0) * 100) + '%'; } });
        const raw = res?.data?.text || '';
        if (!code) {
          const nums = raw.match(/\b\d{6,14}\b/g) || [];
          code = nums.sort((a, b) => b.length - a.length)[0] || '';
        }
        closeScanner(true);
        goPage('products', true);
        setTimeout(() => {
          const pc = document.getElementById('pCode');
          const pd = document.getElementById('pDesc');
          const lm = document.getElementById('labelMsg');
          if (!code) { if (lm) { lm.className = 'alert alert-error'; lm.textContent = 'Ürün kodu okunamadı.'; lm.style.display = ''; } return; }
          const existing = pBy(code);
          const desc = existing?.description || extractDesc(raw, code);
          if (pc) pc.value = code;
          if (pd) pd.value = desc;
          if (lm) {
            lm.style.display = '';
            if (existing) { lm.className = 'alert alert-success'; lm.textContent = '✓ Kayıtlı ürün bulundu, bilgiler getirildi.'; }
            else if (desc) { lm.className = 'alert alert-success'; lm.textContent = '✓ Etiket okundu. Ürün kodu ve tanımı dolduruldu.'; }
            else { lm.className = 'alert alert-warn'; lm.textContent = '⚠ Ürün kodu okundu ancak tanım çıkarılamadı. Lütfen elle doldurun.'; }
          }
        }, 50);
      } catch (e) {
        closeScanner(true);
        toast('OCR hatası: ' + e.message, 'err');
      }
    };
  } catch (e) { closeScanner(true); toast('Kamera açılamadı: ' + e.message, 'err'); }
}
window.scanProductLabel = scanProductLabel;

// ─── AFTER RENDER ─────────────────────────────────────────────────────────────
function afterRender() {
  // Enter key on shelf input
  const sq = document.getElementById('shelfQuery');
  if (sq) sq.addEventListener('keydown', e => { if (e.key === 'Enter') queryShelf(); });
  const ns = document.getElementById('newShelf');
  if (ns) ns.addEventListener('keydown', e => { if (e.key === 'Enter') addShelf(); });
  const nm = document.getElementById('newMachine');
  if (nm) nm.addEventListener('keydown', e => { if (e.key === 'Enter') addMachine(); });
}

document.querySelectorAll('[data-page]').forEach(b => b.addEventListener('click', () => goPage(b.dataset.page)));
history.replaceState({ page: state.page || 'dashboard' }, '', location.href);
renderPage();
