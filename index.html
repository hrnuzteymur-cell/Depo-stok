<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#102a36"><title>Kansan Depo</title><style>:root{--bg:#f3f5f4;--s:#fff;--n:#102a36;--n2:#173b4c;--a:#e4a21a;--ink:#172326;--m:#718086;--line:#e3e8e6;--g:#2e7c58;--r:#b7443c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.side{position:fixed;inset:0 auto 0 0;width:238px;background:var(--n);color:#fff;padding:24px 16px}.brand{padding:4px 10px 22px;border-bottom:1px solid #ffffff18;margin-bottom:15px}.mark{width:42px;height:42px;border-radius:13px;background:var(--a);color:var(--n);display:grid;place-items:center;font-weight:900;margin-bottom:10px}.brand b,.brand small{display:block}.brand small{color:#9fb2bb;font-size:10px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#b8c7cd;border-radius:11px;padding:12px;text-align:left;font-weight:700}.nav button.active{background:#ffffff18;color:#fff}.top{margin-left:238px;height:68px;background:#fffffff2;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.top b{font-size:13px}.status{font-size:11px;color:var(--m)}main{margin-left:238px;padding:26px 28px 80px}.ey{font-size:9px;letter-spacing:.16em;font-weight:900;color:#789097}.welcome{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.welcome h2,.head h2{font-size:28px;margin:5px 0 6px}.welcome p,.head p{margin:0;color:var(--m);font-size:13px}.ready{background:#e9f5ef;color:var(--g);padding:8px 11px;border-radius:999px;font-size:11px;font-weight:800}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.act{border:1px solid var(--line);background:var(--s);border-radius:16px;min-height:98px;padding:16px;text-align:left;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center}.act.primary{background:var(--n2);color:#fff}.ico{width:44px;height:44px;border-radius:13px;background:#edf2f1;display:grid;place-items:center;font-size:21px}.primary .ico{background:#ffffff1c}.act b,.act small{display:block}.act small{color:var(--m);font-size:10px;margin-top:4px}.primary small{color:#bdd0d8}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:16px}.metric{background:#e9edeb;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}.metric span{font-size:9px;text-transform:uppercase;color:#6d7d82;font-weight:800}.metric strong{font-size:21px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:15px}.title{font-weight:900;font-size:13px;margin-bottom:13px}.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:9px;text-transform:uppercase;color:#74868c;font-weight:900}input,select{width:100%;border:1px solid #dce3e1;background:#fbfcfc;border-radius:10px;padding:11px 12px;outline:none}.scan{display:flex;gap:7px}.scan input{flex:1}.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--n2);color:#fff;font-weight:800}.btn.sec{background:#edf2f1;color:var(--n2)}.head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:16px}.table{overflow:auto;border:1px solid #edf0ef;border-radius:12px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:10px;border-bottom:1px solid #edf0ef;white-space:nowrap;text-align:left}th{font-size:8px;text-transform:uppercase;color:#7c8c92;background:#f8faf9}.badge{padding:4px 7px;border-radius:999px;font-size:8px;font-weight:900}.in{background:#e5f3eb;color:var(--g)}.out{background:#f8e8e6;color:var(--r)}.move{background:#eaf0f3;color:var(--n2)}.empty,.note{text-align:center;color:var(--m);padding:18px;font-size:11px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{display:inline-flex;align-items:center;gap:6px;background:#edf2f1;border-radius:999px;padding:6px 9px;font-size:11px}.chip button{border:0;background:transparent;color:var(--r);font-weight:900}.bottom{display:none}dialog{border:0;border-radius:18px;padding:0;width:92%;max-width:500px}dialog::backdrop{background:#08181f99}.dlg{padding:18px}video{width:100%;background:#111;border-radius:12px}@media(max-width:900px){.actions{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.side{display:none}.top{margin-left:0;height:58px;padding:0 15px}.status{display:none}main{margin-left:0;padding:18px 12px 92px}.welcome h2,.head h2{font-size:23px}.welcome p{font-size:11px}.ready{display:none}.actions{grid-template-columns:1fr 1fr;gap:9px}.act{min-height:106px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:14px}.ico{width:38px;height:38px;font-size:18px}.act b{font-size:12px}.act small{font-size:9px}.metrics{grid-template-columns:1fr 1fr}.g4,.g2{grid-template-columns:1fr}.panel{padding:14px}.bottom{position:fixed;left:8px;right:8px;bottom:8px;height:64px;background:#102a36f5;border-radius:19px;display:grid;grid-template-columns:repeat(6,1fr);padding:6px;z-index:20}.bottom button{border:0;background:transparent;color:#9fb2ba;border-radius:13px;font-size:8px;font-weight:800}.bottom button.active{background:#ffffff18;color:#fff}}</style></head><body><aside class="side"><div class="brand"><div class="mark">K</div><b>KANSAN DEPO</b><small>Stok & Lokasyon Yönetimi</small></div><nav class="nav"><button data-tab="dashboard">⌂ Ana Sayfa</button><button data-tab="urunler">□ Ürünler</button><button data-tab="giris">＋ Stok Girişi</button><button data-tab="ara">⌕ Ürün Ara</button><button data-tab="raf">▦ Raf Sorgula</button><button data-tab="transfer">⇄ Raf Transferi</button><button data-tab="makine">⚙ Makineye Çıkış</button><button data-tab="hareket">≡ Hareketler</button></nav></aside><header class="top"><b>Depo Yönetim Paneli</b><span class="status" id="saveState">Hazır</span></header><main id="main"></main><nav class="bottom"><button data-tab="dashboard">⌂<br>Ana</button><button data-tab="urunler">□<br>Ürün</button><button data-tab="ara">⌕<br>Ara</button><button data-tab="giris">＋<br>Giriş</button><button data-tab="transfer">⇄<br>Transfer</button><button data-tab="raf">▦<br>Raf</button></nav><dialog id="scanDialog"><div class="dlg"><div class="title">Barkod Oku</div><video id="scanVideo" autoplay playsinline></video><div id="scanInfo" class="note">Kamera hazırlanıyor...</div><button class="btn sec" onclick="closeScanner()">Kapat</button></div></dialog><script>const KEY='kansan-depo-v2';let state=load()||{products:[],stock:[],movements:[],machines:[],tab:'dashboard'};state.products=Array.isArray(state.products)?state.products:[];state.stock=Array.isArray(state.stock)?state.stock:[];state.movements=Array.isArray(state.movements)?state.movements:[];state.machines=Array.isArray(state.machines)?state.machines.filter(m=>!['LINE-1','LINE-2','OFFLINE-1'].includes(m)):[];function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}function save(){localStorage.setItem(KEY,JSON.stringify(state));let x=document.getElementById('saveState');if(x)x.textContent='Kaydedildi'}function uid(){return Date.now()+'-'+Math.random().toString(36).slice(2,8)}function now(){return new Date().toLocaleString('tr-TR')}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function num(v){let n=Number(v);return Number.isFinite(n)?n:0}function pBy(b){return state.products.find(p=>p.barcode===b)}function qty(b){return state.stock.filter(s=>s.barcode===b).reduce((a,s)=>a+s.qty,0)}function at(b,l){return state.stock.find(s=>s.barcode===b&&s.location===l)}function move(type,b,q,from='',to='',machine='',note=''){let p=pBy(b);state.movements.unshift({id:uid(),date:now(),type,barcode:b,productName:p?.name||'',qty:q,from,to,machine,note})}function addStock(b,l,q){let s=at(b,l);s?s.qty+=q:state.stock.push({id:uid(),barcode:b,location:l,qty:q});state.stock=state.stock.filter(x=>x.qty>0)}function remStock(b,l,q){let s=at(b,l);if(!s||s.qty<q)return false;s.qty-=q;state.stock=state.stock.filter(x=>x.qty>0);return true}function ensure(b){let p=pBy(b);if(!p){if(confirm('Bu barkod kayıtlı değil. Ürünler ekranına geçilsin mi?'))go('urunler');return null}return p}function dash(){let tq=state.stock.reduce((a,s)=>a+s.qty,0),loc=new Set(state.stock.map(s=>s.location)).size;return `<section class="welcome"><div><span class="ey">DEPO YÖNETİMİ</span><h2>Bugün ne yapmak istiyorsun?</h2><p>Ürünü bul, rafa al, transfer et veya makineye çıkar.</p></div><div class="ready">● Sistem hazır</div></section><section class="actions"><button class="act" onclick="go('urunler')"><span class="ico">□</span><span><b>Ürünler / Yeni Ürün</b><small>Ürün kartı oluştur veya listeyi aç</small></span></button><button class="act primary" onclick="go('giris')"><span class="ico">＋</span><span><b>Stok Girişi</b><small>Ürünü rafa yerleştir</small></span></button><button class="act" onclick="go('ara')"><span class="ico">⌕</span><span><b>Ürün Bul</b><small>Hangi rafta olduğunu gör</small></span></button><button class="act" onclick="go('raf')"><span class="ico">▦</span><span><b>Rafı Aç</b><small>Raftaki ürünleri listele</small></span></button><button class="act" onclick="go('transfer')"><span class="ico">⇄</span><span><b>Transfer</b><small>Raftan rafa taşı</small></span></button><button class="act" onclick="go('makine')"><span class="ico">⚙</span><span><b>Makineye Çıkış</b><small>Stoktan düş ve makineye bağla</small></span></button></section><section class="metrics"><div class="metric"><span>Ürün</span><strong>${state.products.length}</strong></div><div class="metric"><span>Stok</span><strong>${tq}</strong></div><div class="metric"><span>Aktif Raf</span><strong>${loc}</strong></div><div class="metric"><span>Hareket</span><strong>${state.movements.length}</strong></div></section><div class="panel"><div class="title">Son Hareketler</div>${movementTable(state.movements.slice(0,8))}</div>`}function products(){return `<div class="head"><div><span class="ey">ÜRÜN YÖNETİMİ</span><h2>Ürün Kartları</h2><p>Standart ürün barkodlarını tanımla.</p></div></div><div class="panel"><div class="title">Yeni Ürün</div><div class="grid g4"><div class="field"><label>Barkod</label><div class="scan"><input id="pBarcode"><button class="btn sec" onclick="scanTo('pBarcode')">📷</button></div></div><div class="field"><label>Ürün Kodu</label><input id="pCode"></div><div class="field"><label>Ürün Adı</label><input id="pName"></div><div class="field"><label>Birim</label><select id="pUnit"><option>Adet</option><option>Kg</option><option>Bobin</option><option>Palet</option><option>Koli</option></select></div></div><div style="margin-top:12px"><button class="btn" onclick="addProduct()">Ürünü Kaydet</button></div></div><div class="panel"><div class="title">Kayıtlı Ürünler</div>${state.products.length?`<div class="table"><table><thead><tr><th>Barkod</th><th>Kod</th><th>Ürün</th><th>Birim</th><th>Stok</th></tr></thead><tbody>${state.products.map(p=>`<tr><td>${esc(p.barcode)}</td><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.unit)}</td><td>${qty(p.barcode)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Henüz ürün kartı yok.</div>'}</div>`}function addProduct(){let b=pBarcode.value.trim(),c=pCode.value.trim(),n=pName.value.trim(),u=pUnit.value;if(!b||!n)return alert('Barkod ve ürün adı zorunlu.');if(pBy(b))return alert('Bu barkod zaten kayıtlı.');state.products.push({id:uid(),barcode:b,code:c,name:n,unit:u});save();render()}function entry(){return `<div class="panel"><div class="title">Stok Girişi</div><div class="grid g4"><div class="field"><label>Ürün Barkodu</label><div class="scan"><input id="eBarcode"><button class="btn sec" onclick="scanTo('eBarcode')">📷</button></div></div><div class="field"><label>Raf / Lokasyon</label><input id="eLocation"></div><div class="field"><label>Miktar</label><input id="eQty" type="number"></div><div class="field"><label>Not</label><input id="eNote"></div></div><div style="margin-top:12px"><button class="btn" onclick="entrySave()">Stoka Al</button></div></div>`}function entrySave(){let b=eBarcode.value.trim(),l=eLocation.value.trim().toUpperCase(),q=num(eQty.value);if(!ensure(b)||!l||q<=0)return;addStock(b,l,q);move('GIRIS',b,q,'',l,'',eNote.value.trim());save();alert('Stok girişi kaydedildi.');render()}function searchPage(){return `<div class="panel"><div class="title">Ürün Ara</div><div class="scan"><input id="sQuery" placeholder="Barkod, kod veya ad"><button class="btn sec" onclick="scanTo('sQuery')">📷</button><button class="btn" onclick="doSearch()">Ara</button></div><div id="sResult" style="margin-top:14px"></div></div>`}function doSearch(){let q=sQuery.value.trim().toLowerCase(),ps=state.products.filter(p=>[p.barcode,p.code,p.name].some(v=>String(v).toLowerCase().includes(q))),o=sResult;if(!ps.length){o.innerHTML='<div class="empty">Ürün bulunamadı.</div>';return}o.innerHTML=ps.map(p=>{let r=state.stock.filter(s=>s.barcode===p.barcode);return `<div class="panel"><b>${esc(p.name)}</b>${r.length?`<div class="table" style="margin-top:8px"><table><thead><tr><th>Raf</th><th>Miktar</th></tr></thead><tbody>${r.map(s=>`<tr><td>${esc(s.location)}</td><td>${s.qty} ${esc(p.unit)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="note">Stokta yok.</div>'}</div>`}).join('')}function raf(){return `<div class="panel"><div class="title">Raf Sorgula</div><div class="scan"><input id="lQuery" placeholder="Raf kodu"><button class="btn sec" onclick="scanTo('lQuery')">📷</button><button class="btn" onclick="doRaf()">Sorgula</button></div><div id="lResult" style="margin-top:14px"></div></div>`}function doRaf(){let l=lQuery.value.trim().toUpperCase(),r=state.stock.filter(s=>s.location===l);lResult.innerHTML=r.length?`<div class="table"><table><thead><tr><th>Ürün</th><th>Barkod</th><th>Miktar</th></tr></thead><tbody>${r.map(s=>{let p=pBy(s.barcode);return `<tr><td>${esc(p?.name||'')}</td><td>${esc(s.barcode)}</td><td>${s.qty} ${esc(p?.unit||'')}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Bu rafta stok yok.</div>'}function transfer(){return `<div class="panel"><div class="title">Raf Transferi</div><div class="grid g4"><div class="field"><label>Ürün Barkodu</label><div class="scan"><input id="tBarcode"><button class="btn sec" onclick="scanTo('tBarcode')">📷</button></div></div><div class="field"><label>Kaynak Raf</label><input id="tFrom"></div><div class="field"><label>Hedef Raf</label><input id="tTo"></div><div class="field"><label>Miktar</label><input id="tQty" type="number"></div></div><div style="margin-top:12px"><button class="btn" onclick="transferSave()">Transfer Et</button></div></div>`}function transferSave(){let b=tBarcode.value.trim(),f=tFrom.value.trim().toUpperCase(),t=tTo.value.trim().toUpperCase(),q=num(tQty.value);if(!ensure(b)||!f||!t||q<=0)return;if(f===t)return alert('Kaynak ve hedef aynı olamaz.');if(!remStock(b,f,q))return alert('Kaynak rafta yeterli stok yok.');addStock(b,t,q);move('TRANSFER',b,q,f,t);save();alert('Transfer tamamlandı.');render()}function machine(){let opts=state.machines.length?`<option value="">Makine seçiniz</option>${state.machines.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('')}`:'<option value="">Önce makine ekleyin</option>';return `<div class="panel"><div class="title">Makineye Çıkış</div><div class="grid g4"><div class="field"><label>Ürün Barkodu</label><div class="scan"><input id="mBarcode"><button class="btn sec" onclick="scanTo('mBarcode')">📷</button></div></div><div class="field"><label>Çıkış Rafı</label><input id="mFrom"></div><div class="field"><label>Miktar</label><input id="mQty" type="number"></div><div class="field"><label>Makine</label><select id="mMachine">${opts}</select></div></div><div class="grid g2" style="margin-top:10px"><div class="field"><label>Operatör</label><input id="mOperator"></div><div class="field"><label>Not</label><input id="mNote"></div></div><div style="margin-top:12px"><button class="btn" onclick="machineSave()">Makineye Ver / Stoktan Düş</button></div></div><div class="panel"><div class="title">Makine Tanımları</div><div class="scan"><input id="newMachine" placeholder="Makine adını manuel yaz"><button class="btn sec" onclick="addMachine()">Kaydet</button></div>${state.machines.length?`<div class="chips">${state.machines.map((m,i)=>`<span class="chip"><b>${esc(m)}</b><button onclick="removeMachine(${i})">×</button></span>`).join('')}</div>`:'<div class="note">Henüz kayıtlı makine yok.</div>'}</div>`}function machineSave(){let b=mBarcode.value.trim(),f=mFrom.value.trim().toUpperCase(),q=num(mQty.value),m=mMachine.value;if(!ensure(b)||!f||q<=0)return;if(!m)return alert('Önce bir makine seçin veya yeni makine kaydedin.');if(!remStock(b,f,q))return alert('Bu rafta yeterli stok yok.');move('MAKINE',b,q,f,'',m,(mOperator.value.trim()?('Operatör: '+mOperator.value.trim()+' · '):'')+mNote.value.trim());save();alert('Makine çıkışı kaydedildi ve stok düşüldü.');render()}function addMachine(){let v=newMachine.value.trim().toUpperCase();if(!v)return alert('Makine adını yazın.');if(state.machines.includes(v))return alert('Bu makine zaten kayıtlı.');state.machines.push(v);save();render()}function removeMachine(i){if(!confirm(state.machines[i]+' silinsin mi?'))return;state.machines.splice(i,1);save();render()}function movementTable(r){if(!r.length)return '<div class="empty">Hareket kaydı yok.</div>';return `<div class="table"><table><thead><tr><th>Tarih</th><th>Tür</th><th>Ürün</th><th>Barkod</th><th>Miktar</th><th>Kaynak</th><th>Hedef</th><th>Makine</th></tr></thead><tbody>${r.map(x=>`<tr><td>${esc(x.date)}</td><td><span class="badge ${x.type==='GIRIS'?'in':x.type==='TRANSFER'?'move':'out'}">${esc(x.type)}</span></td><td>${esc(x.productName)}</td><td>${esc(x.barcode)}</td><td>${x.qty}</td><td>${esc(x.from)}</td><td>${esc(x.to)}</td><td>${esc(x.machine)}</td></tr>`).join('')}</tbody></table></div>`}function movements(){return `<div class="panel"><div class="title">Stok Hareket Geçmişi</div>${movementTable(state.movements)}</div>`}function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));main.innerHTML=state.tab==='dashboard'?dash():state.tab==='urunler'?products():state.tab==='giris'?entry():state.tab==='ara'?searchPage():state.tab==='raf'?raf():state.tab==='transfer'?transfer():state.tab==='makine'?machine():movements()}function go(t){state.tab=t;save();render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));let scanTarget,scanStream,scanTimer;async function scanTo(id){scanTarget=id;if(!('BarcodeDetector'in window)){alert('Bu tarayıcı barkod algılamayı desteklemiyor. Barkodu elle girebilirsin.');return}try{scanDialog.showModal();scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});scanVideo.srcObject=scanStream;let d=new BarcodeDetector({formats:['code_128','ean_13','ean_8','qr_code','code_39','itf']});scanInfo.textContent='Barkodu kameraya gösterin.';scanTimer=setInterval(async()=>{try{let c=await d.detect(scanVideo);if(c.length){document.getElementById(scanTarget).value=c[0].rawValue;closeScanner()}}catch(e){}},400)}catch(e){alert('Kamera açılamadı. Tarayıcı kamera iznini kontrol et.');closeScanner()}}function closeScanner(){clearInterval(scanTimer);if(scanStream)scanStream.getTracks().forEach(t=>t.stop());if(scanDialog.open)scanDialog.close()}save();render();</script></body></html>
