<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#102a36">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Kansan Depo · v11</title>
<style>
:root{--bg:#f3f5f4;--s:#fff;--ink:#172326;--m:#718086;--line:#e3e8e6;--n:#102a36;--n2:#173b4c;--a:#e4a21a;--g:#2e7c58;--r:#b7443c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}.app{min-height:100vh}.side{position:fixed;left:0;top:0;bottom:0;width:238px;background:var(--n);color:#fff;padding:22px 15px;z-index:20}
.brand{padding:5px 10px 22px;border-bottom:1px solid #ffffff18;margin-bottom:15px}.mark{width:42px;height:42px;border-radius:13px;background:var(--a);color:var(--n);display:grid;place-items:center;font-weight:900;margin-bottom:10px}
.brand b{display:block}.brand small{color:#9fb2bb}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:#b8c7cd;border-radius:11px;padding:12px;text-align:left;font-weight:700}
.nav button.active{background:#ffffff18;color:#fff}.top{margin-left:238px;height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 26px;font-weight:800;position:sticky;top:0;z-index:10}
main{margin-left:238px;padding:25px 28px 85px}.welcome h2,.head h2{margin:4px 0 6px;font-size:27px}.welcome p,.head p,.note{color:var(--m);font-size:11px}.ey{font-size:9px;letter-spacing:.15em;color:#789097;font-weight:900}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:18px 0}.act{border:1px solid var(--line);background:#fff;border-radius:16px;min-height:92px;padding:15px;text-align:left;cursor:pointer}.act b,.act small{display:block}
.act b{font-size:13px}.act small{font-size:9px;color:var(--m);margin-top:4px}.act.primary{background:var(--n2);color:#fff}.act.primary small{color:#c2d0d6}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:14px}
.panel.accent{border:2px solid #cfe0da}.title{font-weight:900;font-size:13px;margin-bottom:13px}.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:9px;text-transform:uppercase;color:#74868c;font-weight:900}input,select,textarea{width:100%;border:1px solid #dce3e1;background:#fbfcfc;border-radius:10px;padding:11px 12px;outline:none;color:var(--ink)}
textarea{min-height:82px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:#6d8c98;box-shadow:0 0 0 3px #edf2f3}.scanrow,.row{display:flex;gap:8px;align-items:stretch;width:100%}.scanrow input{flex:1;min-width:0}
.btn,.scanbtn{border:0;border-radius:10px;font-weight:800;cursor:pointer}.btn{padding:11px 14px;background:var(--n2);color:#fff}.btn.sec{background:#edf2f1;color:var(--n2)}.btn.danger{background:var(--r)}.scanbtn{width:56px;min-width:56px;background:#e8efef;color:#173b4c;font-size:22px;display:grid;place-items:center}
.scanbig{width:100%;min-height:82px;border:2px dashed #b8cac4;border-radius:14px;background:#f7faf9;color:var(--n2);font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}.scanbig span{font-size:28px}
.status{margin-top:10px;padding:10px 12px;border-radius:10px;background:#f1f5f4;font-size:11px;color:#5f7279}.status.ok{background:#e8f4ed;color:#286a4a}.status.warn{background:#fff4dc;color:#7a5a13}.status.err{background:#f9e9e7;color:#923b35}
.table{overflow:auto;border:1px solid #edf0ef;border-radius:12px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:10px;border-bottom:1px solid #edf0ef;white-space:nowrap;text-align:left}th{font-size:8px;text-transform:uppercase;color:#7c8c92;background:#f8faf9}
.badge{padding:4px 7px;border-radius:999px;font-size:8px;font-weight:900}.in{background:#e5f3eb;color:var(--g)}.out{background:#f8e8e6;color:var(--r)}.move{background:#eaf0f3;color:var(--n2)}.empty{text-align:center;color:var(--m);padding:28px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.chip{display:inline-flex;gap:7px;align-items:center;background:#edf2f1;border-radius:999px;padding:6px 9px;font-size:11px}.chip button{border:0;background:transparent;color:var(--r);font-weight:900}
.bottom{display:none}.overlay{position:fixed;inset:0;background:rgba(6,20,27,.94);z-index:99999;padding:16px;color:#fff;display:flex;flex-direction:column}.overlay-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.overlay video{width:100%;max-height:62vh;object-fit:cover;border-radius:14px;background:#111}.overlay-actions{display:flex;gap:9px;margin-top:12px}.overlay-actions .btn{flex:1}.overlay-msg{padding:10px 2px;font-size:12px;color:#c8d5da}.progress{height:7px;background:#ffffff20;border-radius:999px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;width:0;background:#e4a21a;transition:width .2s}
@media(max-width:900px){.actions{grid-template-columns:repeat(2,1fr)}.g4,.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.side{display:none}.top{margin-left:0;height:58px;padding:0 15px}main{margin-left:0;padding:18px 12px 92px}.welcome h2,.head h2{font-size:23px}.actions{grid-template-columns:1fr 1fr;gap:9px}.act{min-height:104px}.g4,.g3,.g2{grid-template-columns:1fr}.panel{padding:14px}.bottom{position:fixed;left:8px;right:8px;bottom:8px;height:66px;background:#102a36f6;border-radius:19px;display:grid;grid-template-columns:repeat(6,1fr);padding:6px;z-index:30}.bottom button{border:0;background:transparent;color:#9fb2ba;border-radius:13px;font-size:8px;font-weight:800}.bottom button.active{background:#ffffff18;color:#fff}.overlay{padding:10px}.overlay video{max-height:58vh}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
 <div class="brand"><div class="mark">K</div><b>KANSAN DEPO</b><small>Stok & Lokasyon Yönetimi</small></div>
 <nav class="nav">
  <button data-tab="dashboard">⌂ Ana Sayfa</button><button data-tab="urunler">□ Ürünler</button><button data-tab="giris">＋ Stok Girişi</button><button data-tab="ara">⌕ Ürün Ara</button><button data-tab="raf">▦ Raf Yönetimi</button><button data-tab="transfer">⇄ Raf Transferi</button><button data-tab="makine">⚙ Makineye Çıkış</button><button data-tab="hareket">≡ Hareketler</button>
 </nav>
</aside>
<header class="top">Depo Yönetim Paneli <span style="margin-left:auto;font-size:10px;color:#8a989d;font-weight:700">v11</span></header>
<main id="main"></main>
<nav class="bottom">
 <button data-tab="dashboard">⌂<br>Ana</button><button data-tab="urunler">□<br>Ürün</button><button data-tab="ara">⌕<br>Ara</button><button data-tab="giris">＋<br>Giriş</button><button data-tab="transfer">⇄<br>Transfer</button><button data-tab="raf">▦<br>Raf</button>
</nav>
</div>
<script>
const KEY='kansan-depo-v2';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
const state=load()||{products:[],stock:[],movements:[],machines:[],shelves:[],tab:'dashboard',pendingPlacementCode:''};
if(!Array.isArray(state.products))state.products=[];if(!Array.isArray(state.stock))state.stock=[];if(!Array.isArray(state.movements))state.movements=[];if(!Array.isArray(state.machines))state.machines=[];if(!Array.isArray(state.shelves))state.shelves=[];
state.machines=state.machines.filter(m=>!['LINE-1','LINE-2','OFFLINE-1'].includes(String(m).toUpperCase()));
state.products=state.products.map(p=>({...p,productCode:String(p.productCode||p.barcode||p.code||'').trim(),description:String(p.description||p.name||'').trim()})).filter(p=>p.productCode);
state.stock=state.stock.map(s=>({...s,barcode:String(s.barcode||s.productCode||'').trim(),location:String(s.location||'').toUpperCase()}));
state.stock.forEach(s=>{if(s.location&&!state.shelves.includes(s.location))state.shelves.push(s.location)});
state.shelves=[...new Set(state.shelves.map(x=>String(x).trim().toUpperCase()).filter(Boolean))].sort();
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
save();
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function uid(){return Date.now()+'-'+Math.random().toString(36).slice(2,8)}function now(){return new Date().toLocaleString('tr-TR')}function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function pBy(code){code=String(code||'').trim();return state.products.find(p=>p.productCode===code)}function qty(code){return state.stock.filter(s=>s.barcode===code).reduce((a,s)=>a+num(s.qty),0)}function at(code,loc){return state.stock.find(s=>s.barcode===code&&s.location===loc)}
function ensure(code){const p=pBy(code);if(!p){alert('Bu ürün kodu kayıtlı değil. Önce Ürün sekmesinden etiketi tarayıp ürün oluştur.');return null}return p}function addStock(code,loc,q){let s=at(code,loc);s?s.qty+=q:state.stock.push({id:uid(),barcode:code,location:loc,qty:q});state.stock=state.stock.filter(x=>x.qty>0)}function remStock(code,loc,q){let s=at(code,loc);if(!s||s.qty<q)return false;s.qty-=q;state.stock=state.stock.filter(x=>x.qty>0);return true}
function movement(type,code,q,from='',to='',machine='',note=''){const p=pBy(code);state.movements.unshift({id:uid(),date:now(),type,barcode:code,productName:p?.description||'',qty:q,from,to,machine,note})}
function shelfOptions(selected=''){if(!state.shelves.length)return '<option value="">Önce Raf bölümünden raf ekleyin</option>';return '<option value="">Raf seçiniz</option>'+state.shelves.map(r=>`<option value="${esc(r)}" ${r===selected?'selected':''}>${esc(r)}</option>`).join('')}
function navActive(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab))}function go(t){state.tab=t;save();render()}
function dashboard(){const tq=state.stock.reduce((a,s)=>a+num(s.qty),0),loc=new Set(state.stock.map(s=>s.location)).size;return `<section class="welcome"><span class="ey">DEPO YÖNETİMİ</span><h2>Bugün ne yapmak istiyorsun?</h2><p>Etiketi tara, ürünü rafa al, transfer et veya makineye çıkar.</p></section><section class="actions"><button class="act primary" onclick="go('urunler')"><b>📷 Etiketi Tara / Ürün Ekle</b><small>Tek görüntüden kod ve tanımı al</small></button><button class="act" onclick="go('giris')"><b>＋ Stok Girişi</b><small>Kayıtlı ürünü rafa ekle</small></button><button class="act" onclick="go('ara')"><b>⌕ Ürün Bul</b><small>Hangi rafta olduğunu gör</small></button><button class="act" onclick="go('raf')"><b>▦ Raf Yönetimi</b><small>Raf tanımla veya sorgula</small></button><button class="act" onclick="go('transfer')"><b>⇄ Transfer</b><small>Raftan rafa taşı</small></button><button class="act" onclick="go('makine')"><b>⚙ Makineye Çıkış</b><small>Makineyi seç ve stoktan düş</small></button></section><div class="panel"><div class="title">Özet</div><div class="grid g4"><div><b>${state.products.length}</b><div class="note">Ürün</div></div><div><b>${tq}</b><div class="note">Stok</div></div><div><b>${loc}</b><div class="note">Aktif Raf</div></div><div><b>${state.movements.length}</b><div class="note">Hareket</div></div></div></div>`}
function products(){const pending=state.pendingPlacementCode,p=pending?pBy(pending):null;const placement=p?`<div class="panel accent"><div class="title">Rafa Yerleştir</div><div class="note" style="margin-bottom:12px"><b>${esc(p.productCode)} — ${esc(p.description)}</b><br>Ürün kaydedildi. Şimdi aynı ekrandan rafa yerleştirebilirsin.</div><div class="grid g3"><div class="field"><label>Kayıtlı Raf</label><select id="npShelf">${shelfOptions()}</select></div><div class="field"><label>Miktar</label><input id="npQty" type="number" min="0" step="0.01" placeholder="Miktar"></div><div class="field"><label>Not</label><input id="npNote" placeholder="İsteğe bağlı"></div></div><div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn" onclick="placeNewProduct()">Rafa Yerleştir / Stoka Al</button><button class="btn sec" onclick="cancelPlacement()">Daha Sonra</button>${!state.shelves.length?'<button class="btn sec" onclick="go(\'raf\')">Önce Raf Ekle</button>':''}</div></div>`:'';return `<div class="head"><span class="ey">ÜRÜN YÖNETİMİ</span><h2>Etiketi Tek Seferde Tara</h2><p>Tek taramada ürün kodu ve ürün tanımı otomatik doldurulur.</p></div><div class="panel"><button class="scanbig" onclick="scanProductLabel()"><span>📷</span> ETİKETİ TARA</button><div id="labelStatus" class="status">Etiketi kameraya göster. Ürün kodu ve ürün tanımı tek seferde otomatik doldurulacak.</div><div class="grid g3" style="margin-top:13px"><div class="field"><label>Ürün Kodu</label><input id="pCode" placeholder="Etiketi tara" autocomplete="off"></div><div class="field"><label>Ürün Tanımı</label><textarea id="pDescription" placeholder="Etiketten otomatik okunacak"></textarea></div><div class="field"><label>Birim</label><select id="pUnit"><option>Adet</option><option>Kg</option><option>Bobin</option><option>Palet</option><option>Koli</option></select></div></div><div style="margin-top:12px"><button class="btn" onclick="saveProductAndPlace()">Kaydet ve Rafa Yerleştir</button></div></div>${placement}<div class="panel"><div class="title">Kayıtlı Ürünler (${state.products.length})</div>${state.products.length?`<div class="table"><table><thead><tr><th>Ürün Kodu</th><th>Ürün Tanımı</th><th>Birim</th><th>Stok</th></tr></thead><tbody>${state.products.map(p=>`<tr><td>${esc(p.productCode)}</td><td>${esc(p.description)}</td><td>${esc(p.unit||'Adet')}</td><td>${qty(p.productCode)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Henüz ürün yok.</div>'}</div>`}
function saveProductAndPlace(){const code=document.getElementById('pCode').value.trim(),description=document.getElementById('pDescription').value.trim(),unit=document.getElementById('pUnit').value;if(!code)return alert('Önce etiketi tarayıp ürün kodunu al.');if(!description)return alert('Ürün tanımı boş. OCR sonucunu kontrol et veya tanımı elle düzelt.');let p=pBy(code);if(p){p.description=description||p.description;p.unit=unit||p.unit}else state.products.push({id:uid(),productCode:code,barcode:code,code:code,description,name:description,unit});state.pendingPlacementCode=code;save();render()}
function placeNewProduct(){const code=state.pendingPlacementCode,shelf=document.getElementById('npShelf')?.value||'',q=num(document.getElementById('npQty')?.value),note=document.getElementById('npNote')?.value.trim()||'';if(!shelf)return alert('Kayıtlı bir raf seç.');if(q<=0)return alert('Miktarı gir.');addStock(code,shelf,q);movement('GIRIS',code,q,'',shelf,'',note);state.pendingPlacementCode='';save();alert('Ürün rafa yerleştirildi.');render()}function cancelPlacement(){state.pendingPlacementCode='';save();render()}
function entry(){return `<div class="panel"><div class="title">Stok Girişi</div><div class="grid g3"><div class="field"><label>Ürün Kodu</label><div class="scanrow"><input id="eCode"><button class="scanbtn" onclick="scanBarcodeToInput('eCode','Ürün kodunu okut')">📷</button></div></div><div class="field"><label>Raf</label><div class="scanrow"><select id="eShelf">${shelfOptions()}</select><button class="scanbtn" onclick="scanShelfToSelect('eShelf','Rafı okut')">📷</button></div></div><div class="field"><label>Miktar</label><input id="eQty" type="number" min="0" step="0.01"></div></div><div style="margin-top:12px"><button class="btn" onclick="entrySave()">Stoka Al</button></div></div>`}
function entrySave(){const c=eCode.value.trim(),s=eShelf.value,q=num(eQty.value);if(!ensure(c)||!s||q<=0)return;addStock(c,s,q);movement('GIRIS',c,q,'',s);save();alert('Stok girişi kaydedildi.');render()}
function searchPage(){return `<div class="panel"><div class="title">Ürün Ara</div><div class="row"><div class="scanrow"><input id="sQuery" placeholder="Ürün kodu veya tanımı"><button class="scanbtn" onclick="scanBarcodeToInput('sQuery','Ürün kodunu okut')">📷</button></div><button class="btn" onclick="doSearch()">Ara</button></div><div id="sResult" style="margin-top:13px"></div></div>`}
function doSearch(){const q=sQuery.value.trim().toLowerCase(),ps=state.products.filter(p=>[p.productCode,p.description].some(v=>String(v).toLowerCase().includes(q)));sResult.innerHTML=ps.length?ps.map(p=>`<div class="panel"><b>${esc(p.description)}</b><div class="note">${esc(p.productCode)}</div></div>`).join(''):'<div class="empty">Ürün bulunamadı.</div>'}
function rafPage(){const chips=state.shelves.length?`<div class="chips">${state.shelves.map(r=>`<span class="chip"><b>${esc(r)}</b><button onclick="removeShelf('${esc(r)}')">×</button></span>`).join('')}</div>`:'<div class="note">Henüz raf yok.</div>';return `<div class="panel"><div class="title">Raf Tanımları</div><div class="row"><input id="newShelf" placeholder="Örn. 1A.1.1"><button class="btn sec" onclick="addShelf()">Raf Ekle</button></div>${chips}</div>`}
function addShelf(){const v=newShelf.value.trim().toUpperCase();if(!v)return;if(!state.shelves.includes(v))state.shelves.push(v);save();render()}function removeShelf(v){if(state.stock.some(s=>s.location===v&&s.qty>0))return alert('Bu rafta stok var.');state.shelves=state.shelves.filter(r=>r!==v);save();render()}
function transferPage(){return `<div class="panel"><div class="title">Raf Transferi</div><div class="grid g4"><div class="field"><label>Ürün Kodu</label><div class="scanrow"><input id="tCode"><button class="scanbtn" onclick="scanBarcodeToInput('tCode','Ürün kodunu okut')">📷</button></div></div><div class="field"><label>Kaynak Raf</label><select id="tFrom">${shelfOptions()}</select></div><div class="field"><label>Hedef Raf</label><select id="tTo">${shelfOptions()}</select></div><div class="field"><label>Miktar</label><input id="tQty" type="number"></div></div><div style="margin-top:12px"><button class="btn" onclick="transferSave()">Transfer Et</button></div></div>`}
function transferSave(){const c=tCode.value.trim(),f=tFrom.value,t=tTo.value,q=num(tQty.value);if(!ensure(c)||!f||!t||q<=0)return;if(f===t)return alert('Kaynak ve hedef aynı olamaz.');if(!remStock(c,f,q))return alert('Kaynak rafta yeterli stok yok.');addStock(c,t,q);movement('TRANSFER',c,q,f,t);save();alert('Transfer tamamlandı.');render()}
function machinePage(){const opts=state.machines.length?'<option value="">Makine seçiniz</option>'+state.machines.map(m=>`<option>${esc(m)}</option>`).join(''):'<option value="">Önce aşağıdan makine ekleyin</option>';return `<div class="panel"><div class="title">Makineye Çıkış</div><div class="grid g4"><div class="field"><label>Ürün Kodu</label><div class="scanrow"><input id="mCode"><button class="scanbtn" onclick="scanBarcodeToInput('mCode','Ürün kodunu okut')">📷</button></div></div><div class="field"><label>Çıkış Rafı</label><select id="mFrom">${shelfOptions()}</select></div><div class="field"><label>Miktar</label><input id="mQty" type="number"></div><div class="field"><label>Makine</label><select id="mMachine">${opts}</select></div></div><div style="margin-top:12px"><button class="btn" onclick="machineSave()">Makineye Ver / Stoktan Düş</button></div></div><div class="panel"><div class="title">Makine Tanımları</div><div class="row"><input id="newMachine" placeholder="Makine adını manuel yaz"><button class="btn sec" onclick="addMachine()">Kaydet</button></div></div>`}
function addMachine(){const v=newMachine.value.trim().toUpperCase();if(v&&!state.machines.includes(v)){state.machines.push(v);save();render()}}function machineSave(){const c=mCode.value.trim(),f=mFrom.value,q=num(mQty.value),m=mMachine.value;if(!ensure(c)||!f||q<=0||!m)return;if(!remStock(c,f,q))return alert('Bu rafta yeterli stok yok.');movement('MAKINE',c,q,f,'',m);save();alert('Makine çıkışı kaydedildi.');render()}
function movementTable(rows){if(!rows.length)return '<div class="empty">Hareket kaydı yok.</div>';return `<div class="table"><table><thead><tr><th>Tarih</th><th>Tür</th><th>Ürün</th><th>Kod</th><th>Miktar</th><th>Kaynak</th><th>Hedef</th><th>Makine</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.productName)}</td><td>${esc(x.barcode)}</td><td>${x.qty}</td><td>${esc(x.from)}</td><td>${esc(x.to)}</td><td>${esc(x.machine)}</td></tr>`).join('')}</tbody></table></div>`}function movementsPage(){return `<div class="panel"><div class="title">Stok Hareket Geçmişi</div>${movementTable(state.movements)}</div>`}
function render(){navActive();document.getElementById('main').innerHTML=state.tab==='dashboard'?dashboard():state.tab==='urunler'?products():state.tab==='giris'?entry():state.tab==='ara'?searchPage():state.tab==='raf'?rafPage():state.tab==='transfer'?transferPage():state.tab==='makine'?machinePage():movementsPage()}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
let scanStream=null,scanTimer=null,scanOverlay=null,tesseractLoading=null;function closeScanner(){if(scanTimer){clearInterval(scanTimer);scanTimer=null}if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}if(scanOverlay){scanOverlay.remove();scanOverlay=null}}
function makeOverlay(title,withCapture=false){closeScanner();const ov=document.createElement('div');ov.className='overlay';scanOverlay=ov;ov.innerHTML=`<div class="overlay-head"><b>${esc(title)}</b><button class="btn sec" id="scanClose">Kapat</button></div><video id="scanVideo" autoplay playsinline></video><div class="overlay-msg" id="scanMsg">Kamerayı etikete yaklaştır.</div>${withCapture?'<div class="progress"><i id="ocrBar"></i></div><div class="overlay-actions"><button class="btn" id="captureBtn">Etiketi Tara</button></div>':''}`;document.body.appendChild(ov);document.getElementById('scanClose').onclick=closeScanner;return ov}
async function openCamera(title,withCapture=false){if(!navigator.mediaDevices?.getUserMedia)throw new Error('Bu tarayıcı kamera erişimini desteklemiyor.');const ov=makeOverlay(title,withCapture);scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});document.getElementById('scanVideo').srcObject=scanStream;return ov}
async function detectBarcode(source){if(!('BarcodeDetector' in window))return '';try{const detector=new BarcodeDetector();const codes=await detector.detect(source);return codes?.[0]?.rawValue||''}catch(e){return ''}}
async function scanBarcodeValue(title){await openCamera(title,false);const video=document.getElementById('scanVideo');return await new Promise((resolve,reject)=>{let tries=0;scanTimer=setInterval(async()=>{tries++;const v=await detectBarcode(video);if(v){closeScanner();resolve(v)}else if(tries>100){closeScanner();reject(new Error('Barkod okunamadı. Tekrar dene.'))}},250)})}
async function scanBarcodeToInput(id,title){try{const v=await scanBarcodeValue(title);const el=document.getElementById(id);if(el)el.value=v}catch(e){alert(e.message)}}async function scanShelfToSelect(id,title){try{const v=(await scanBarcodeValue(title)).trim().toUpperCase();if(!state.shelves.includes(v))return alert('Okutulan raf kayıtlı değil: '+v);const el=document.getElementById(id);if(el)el.value=v}catch(e){alert(e.message)}}
function loadTesseract(){if(window.Tesseract)return Promise.resolve(window.Tesseract);if(tesseractLoading)return tesseractLoading;tesseractLoading=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=()=>resolve(window.Tesseract);s.onerror=()=>reject(new Error('OCR bileşeni yüklenemedi.'));document.head.appendChild(s)});return tesseractLoading}
function cleanOCRDescription(text,code){const lines=String(text||'').split(/\r?\n/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean),codeNorm=String(code||'').replace(/\s/g,''),junk=/^(barkod|barcode|raf kodu|raf|tarih|date|barkod bas|barkod baş)/i,date=/\b\d{1,2}[.\-/]\d{1,2}[.\-/]\d{2,4}\b/,kept=[];for(let line of lines){const compact=line.replace(/\s/g,'');if(!line||junk.test(line)||date.test(line))continue;if(codeNorm&&(compact===codeNorm||compact.includes(codeNorm)))continue;if(/^\d{5,}$/.test(compact))continue;if(line.length<2)continue;kept.push(line)}return kept.join(' ').replace(/\s+([),.;:])/g,'$1').replace(/([(])\s+/g,'$1').trim()}
async function scanProductLabel(){try{await openCamera('Ürün Etiketini Tara',true);const video=document.getElementById('scanVideo'),msg=document.getElementById('scanMsg'),btn=document.getElementById('captureBtn'),bar=document.getElementById('ocrBar');msg.textContent='Etiketin tamamı net görünsün. Etiketi Tara’ya dokun.';btn.onclick=async()=>{btn.disabled=true;btn.textContent='İşleniyor...';const canvas=document.createElement('canvas');canvas.width=video.videoWidth||1280;canvas.height=video.videoHeight||720;canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);let code=await detectBarcode(canvas);try{const T=await loadTesseract();const res=await T.recognize(canvas,'tur+eng',{logger:m=>{if(m.status==='recognizing text'&&bar)bar.style.width=Math.round((m.progress||0)*100)+'%'}}),raw=res?.data?.text||'';if(!code){const nums=raw.match(/\b\d{6,14}\b/g)||[];code=nums.sort((a,b)=>b.length-a.length)[0]||''}if(!code){btn.disabled=false;btn.textContent='Tekrar Tara';msg.textContent='Ürün kodu okunamadı.';return}const existing=pBy(code),desc=existing?.description||cleanOCRDescription(raw,code);closeScanner();state.tab='urunler';save();render();document.getElementById('pCode').value=code;document.getElementById('pDescription').value=desc;const status=document.getElementById('labelStatus');if(existing){document.getElementById('pUnit').value=existing.unit||'Adet';status.className='status ok';status.textContent='Kayıtlı ürün bulundu. Tanım otomatik getirildi.'}else if(desc){status.className='status ok';status.textContent='Etiket okundu. Ürün kodu ve ürün tanımı otomatik dolduruldu.'}else{status.className='status warn';status.textContent='Ürün kodu okundu; ürün tanımı çıkarılamadı. Tanımı elle düzelt.'}}catch(e){closeScanner();state.tab='urunler';save();render();document.getElementById('pCode').value=code||'';const status=document.getElementById('labelStatus');status.className='status err';status.textContent=(code?'Ürün kodu okundu. ':'')+'OCR tamamlanamadı: '+e.message}}}catch(e){closeScanner();alert('Kamera açılamadı: '+e.message)}}
render();
</script>
