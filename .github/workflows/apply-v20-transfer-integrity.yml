name: Apply v20 transfer integrity

on:
  push:
    paths:
      - '.github/workflows/apply-v20-transfer-integrity.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Strengthen transfer logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Kansan Depo · v19', 'Kansan Depo · v20')

          old = '''function transferSave() {
  const code = document.getElementById('tCode').value.trim();
  const from = document.getElementById('tFrom').value;
  const to = document.getElementById('tTo').value;
  const q = num(document.getElementById('tQty').value);
  if (!code) { toast('Ürün kodu girin', 'err'); return; }
  if (!pBy(code)) { toast('Ürün kayıtlı değil', 'err'); return; }
  if (!from) { toast('Kaynak raf seçin', 'err'); return; }
  if (!to) { toast('Hedef raf seçin', 'err'); return; }
  if (from === to) { toast('Kaynak ve hedef aynı olamaz', 'err'); return; }
  if (q <= 0) { toast('Miktar sıfırdan büyük olmalı', 'err'); return; }
  if (!remStock(code, from, q)) { toast(`${from} rafında yeterli stok yok`, 'err'); return; }
  addStock(code, to, q);
  logMovement('TRANSFER', code, q, from, to);
  save();
  toast(`${q} adet → ${from} ▸ ${to}`);
  document.getElementById('tCode').value = '';
  document.getElementById('tQty').value = '';
  const inf = document.getElementById('tInfo'); if (inf) inf.style.display = 'none';
  const si = document.getElementById('tShelfInfo'); if (si) si.style.display = 'none';
}
window.transferSave = transferSave;'''

          new = '''function transferStock(code, from, to, q) {
  const EPS = 1e-9;
  if (!pBy(code)) return { ok: false, error: 'Ürün kayıtlı değil' };
  if (!state.shelves.includes(from)) return { ok: false, error: 'Kaynak raf kayıtlı değil' };
  if (!state.shelves.includes(to)) return { ok: false, error: 'Hedef raf kayıtlı değil' };
  if (from === to) return { ok: false, error: 'Kaynak ve hedef aynı olamaz' };
  if (!Number.isFinite(q) || q <= 0) return { ok: false, error: 'Miktar sıfırdan büyük olmalı' };

  const sourceBefore = qtyAt(code, from);
  const targetBefore = qtyAt(code, to);
  const totalBefore = totalQty(code);
  if (sourceBefore + EPS < q) return { ok: false, error: `${from} rafında yeterli stok yok` };

  const stockBefore = state.stock.map(s => ({ ...s }));
  if (!remStock(code, from, q)) return { ok: false, error: `${from} rafında yeterli stok yok` };
  addStock(code, to, q);

  const sourceAfter = qtyAt(code, from);
  const targetAfter = qtyAt(code, to);
  const totalAfter = totalQty(code);
  const valid =
    Math.abs(sourceAfter - (sourceBefore - q)) <= EPS &&
    Math.abs(targetAfter - (targetBefore + q)) <= EPS &&
    Math.abs(totalAfter - totalBefore) <= EPS;

  if (!valid) {
    state.stock = stockBefore;
    return { ok: false, error: 'Transfer stok kontrolü başarısız. İşlem geri alındı.' };
  }
  return { ok: true, totalBefore, totalAfter, sourceBefore, sourceAfter, targetBefore, targetAfter };
}
window.transferStock = transferStock;

function transferSave() {
  const code = document.getElementById('tCode').value.trim();
  const from = document.getElementById('tFrom').value;
  const to = document.getElementById('tTo').value;
  const q = num(document.getElementById('tQty').value);
  if (!code) { toast('Ürün kodu girin', 'err'); return; }
  if (!from) { toast('Kaynak raf seçin', 'err'); return; }
  if (!to) { toast('Hedef raf seçin', 'err'); return; }

  const result = transferStock(code, from, to, q);
  if (!result.ok) { toast(result.error, 'err'); return; }

  logMovement('TRANSFER', code, q, from, to);
  save();
  const unit = pBy(code)?.unit || 'Adet';
  toast(`${q} ${unit} → ${from} ▸ ${to}`);
  document.getElementById('tCode').value = '';
  document.getElementById('tQty').value = '';
  const inf = document.getElementById('tInfo'); if (inf) inf.style.display = 'none';
  const si = document.getElementById('tShelfInfo'); if (si) si.style.display = 'none';
}
window.transferSave = transferSave;'''

          if old not in s:
              raise SystemExit('Expected v19 transfer block not found; refusing to modify index.html')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>', s, re.S)
          Path('/tmp/app.js').write_text('\n'.join(scripts), encoding='utf-8')
          assert 'Kansan Depo · v20' in s
          assert 'function transferStock(code, from, to, q)' in s
          assert 'Transfer stok kontrolü başarısız. İşlem geri alındı.' in s
          PY
          node --check /tmp/app.js

      - name: Test transfer invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('function transferStock(code, from, to, q)')
          i=start
          brace=0
          seen=False
          while i < len(s):
              if s[i]=='{': brace+=1; seen=True
              elif s[i]=='}':
                  brace-=1
                  if seen and brace==0:
                      i+=1
                      break
              i+=1
          fn=s[start:i]
          harness = r'''
const state = {products:[{productCode:'P1'}], shelves:['R1','R2'], stock:[{id:'1',barcode:'P1',location:'R1',qty:10},{id:'2',barcode:'P1',location:'R2',qty:4}]};
function pBy(code){ return state.products.find(p=>p.productCode===code); }
function qtyAt(code,loc){ return state.stock.filter(s=>s.barcode===code&&s.location===loc).reduce((a,s)=>a+s.qty,0); }
function totalQty(code){ return state.stock.filter(s=>s.barcode===code).reduce((a,s)=>a+s.qty,0); }
function uid(){ return String(Math.random()); }
function addStock(code,loc,q){ let s=state.stock.find(s=>s.barcode===code&&s.location===loc); if(s)s.qty+=q; else state.stock.push({id:uid(),barcode:code,location:loc,qty:q}); }
function remStock(code,loc,q){ let left=q; for(const s of state.stock.filter(s=>s.barcode===code&&s.location===loc)){const take=Math.min(s.qty,left);s.qty-=take;left-=take;if(left<=1e-9)break;} if(left>1e-9)return false; state.stock=state.stock.filter(s=>s.qty>1e-9); return true; }
'''
          tests = r'''
let r=transferStock('P1','R1','R2',3);
if(!r.ok || qtyAt('P1','R1')!==7 || qtyAt('P1','R2')!==7 || totalQty('P1')!==14) throw new Error('valid transfer failed');
const snapshot=JSON.stringify(state.stock);
r=transferStock('P1','R1','R2',99);
if(r.ok || JSON.stringify(state.stock)!==snapshot) throw new Error('insufficient stock mutated state');
r=transferStock('P1','R1','R1',1);
if(r.ok || JSON.stringify(state.stock)!==snapshot) throw new Error('same shelf mutated state');
r=transferStock('P1','R1','R2',0);
if(r.ok || JSON.stringify(state.stock)!==snapshot) throw new Error('zero qty mutated state');
console.log('TRANSFER_INVARIANTS_OK');
'''
          Path('/tmp/transfer-test.js').write_text(harness+fn+'\n'+tests, encoding='utf-8')
          PY
          node /tmp/transfer-test.js

      - name: Commit v20
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'v20: raf transferinde stok bütünlüğü' || exit 0
          git push
