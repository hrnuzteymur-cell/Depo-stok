name: Apply v20 transfer integrity

on:
  push:
    paths:
      - '.github/workflows/apply-v20-transfer-integrity.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Strengthen transfer logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Kansan Depo · v19','Kansan Depo · v20')
          start=s.index('function transferSave() {')
          end=s.index('window.transferSave = transferSave;', start)+len('window.transferSave = transferSave;')
          new=r'''function transferStock(code, from, to, q) {
  const EPS = 1e-9;
  if (!pBy(code)) return { ok: false, error: 'Ürün kayıtlı değil' };
  if (!state.shelves.includes(from)) return { ok: false, error: 'Kaynak raf kayıtlı değil' };
  if (!state.shelves.includes(to)) return { ok: false, error: 'Hedef raf kayıtlı değil' };
  if (from === to) return { ok: false, error: 'Kaynak ve hedef aynı olamaz' };
  if (!Number.isFinite(q) || q <= 0) return { ok: false, error: 'Miktar sıfırdan büyük olmalı' };

  const sourceBefore = qtyAt(code, from);
  const targetBefore = qtyAt(code, to);
  const totalBefore = totalQty(code);
  if (sourceBefore + EPS < q) return { ok: false, error: `${from} rafında yeterli stok yok` };

  const stockBefore = state.stock.map(s => ({ ...s }));
  if (!remStock(code, from, q)) return { ok: false, error: `${from} rafında yeterli stok yok` };
  addStock(code, to, q);

  const sourceAfter = qtyAt(code, from);
  const targetAfter = qtyAt(code, to);
  const totalAfter = totalQty(code);
  const valid = Math.abs(sourceAfter - (sourceBefore - q)) <= EPS &&
                Math.abs(targetAfter - (targetBefore + q)) <= EPS &&
                Math.abs(totalAfter - totalBefore) <= EPS;
  if (!valid) {
    state.stock = stockBefore;
    return { ok: false, error: 'Transfer stok kontrolü başarısız. İşlem geri alındı.' };
  }
  return { ok: true, totalBefore, totalAfter };
}
window.transferStock = transferStock;

function transferSave() {
  const code = document.getElementById('tCode').value.trim();
  const from = document.getElementById('tFrom').value;
  const to = document.getElementById('tTo').value;
  const q = num(document.getElementById('tQty').value);
  if (!code) { toast('Ürün kodu girin', 'err'); return; }
  if (!from) { toast('Kaynak raf seçin', 'err'); return; }
  if (!to) { toast('Hedef raf seçin', 'err'); return; }
  const result = transferStock(code, from, to, q);
  if (!result.ok) { toast(result.error, 'err'); return; }
  logMovement('TRANSFER', code, q, from, to);
  save();
  const unit = pBy(code)?.unit || 'Adet';
  toast(`${q} ${unit} → ${from} ▸ ${to}`);
  document.getElementById('tCode').value = '';
  document.getElementById('tQty').value = '';
  const inf = document.getElementById('tInfo'); if (inf) inf.style.display = 'none';
  const si = document.getElementById('tShelfInfo'); if (si) si.style.display = 'none';
}
window.transferSave = transferSave;'''
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify JS and transfer invariants
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'Kansan Depo · v20' in s
          assert 'function transferStock(code, from, to, q)' in s
          assert "Math.abs(totalAfter - totalBefore) <= EPS" in s
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
          node - <<'JS'
          const state={products:[{productCode:'P1'}],shelves:['R1','R2'],stock:[{barcode:'P1',location:'R1',qty:10},{barcode:'P1',location:'R2',qty:4}]};
          const pBy=c=>state.products.find(p=>p.productCode===c);
          const qtyAt=(c,l)=>state.stock.filter(s=>s.barcode===c&&s.location===l).reduce((a,s)=>a+s.qty,0);
          const totalQty=c=>state.stock.filter(s=>s.barcode===c).reduce((a,s)=>a+s.qty,0);
          function remStock(c,l,q){const s=state.stock.find(s=>s.barcode===c&&s.location===l);if(!s||s.qty<q)return false;s.qty-=q;state.stock=state.stock.filter(x=>x.qty>0);return true;}
          function addStock(c,l,q){let s=state.stock.find(s=>s.barcode===c&&s.location===l);if(s)s.qty+=q;else state.stock.push({barcode:c,location:l,qty:q});}
          function transferStock(code,from,to,q){const EPS=1e-9;if(!pBy(code)||!state.shelves.includes(from)||!state.shelves.includes(to)||from===to||!Number.isFinite(q)||q<=0)return{ok:false};const sb=qtyAt(code,from),tb=qtyAt(code,to),total=totalQty(code);if(sb+EPS<q)return{ok:false};const backup=state.stock.map(s=>({...s}));if(!remStock(code,from,q))return{ok:false};addStock(code,to,q);const valid=Math.abs(qtyAt(code,from)-(sb-q))<=EPS&&Math.abs(qtyAt(code,to)-(tb+q))<=EPS&&Math.abs(totalQty(code)-total)<=EPS;if(!valid){state.stock=backup;return{ok:false}}return{ok:true}}
          if(!transferStock('P1','R1','R2',3).ok) throw Error('valid transfer failed');
          if(qtyAt('P1','R1')!==7||qtyAt('P1','R2')!==7||totalQty('P1')!==14) throw Error('stock invariant failed');
          const snap=JSON.stringify(state.stock);
          if(transferStock('P1','R1','R2',99).ok||JSON.stringify(state.stock)!==snap) throw Error('insufficient stock mutated');
          if(transferStock('P1','R1','R1',1).ok||JSON.stringify(state.stock)!==snap) throw Error('same shelf mutated');
          console.log('TRANSFER_INVARIANTS_OK');
          JS

      - name: Commit v20
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'v20: raf transferinde stok bütünlüğü'
          git push
