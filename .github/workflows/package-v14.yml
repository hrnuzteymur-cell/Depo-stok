name: Package and Inventory Tests
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: JavaScript syntax checks
        run: |
          node --check pwa.js
          node --check sw.js
          node --check inventory-guards.js
      - name: Inventory math and integrity tests
        run: node tests/inventory-guards.test.js
      - name: Create ZIP
        run: |
          zip -r Kansan_Depo_Stok_v14.zip . -x '.git/*' 'Kansan_Depo_Stok_v14.zip'
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kansan_Depo_Stok_v14
          path: Kansan_Depo_Stok_v14.zip
          if-no-files-found: error
