name: Apply raf urun patch
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[raf-urun-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/patch_raf_urun.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Raf tanımları ve ürün sonrası rafa yerleştirme [raf-urun-done]"
          git push
