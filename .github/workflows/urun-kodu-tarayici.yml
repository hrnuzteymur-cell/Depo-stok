name: Urun kodu tarayici ekle

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[urun-kodu-tarayici]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Urun kodu alanina barkod okuma ekle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if "scanTo('pCode')" in s:
              print('Zaten güncel.')
          else:
              pat = r'<div class="field"><label>Ürün Kodu</label><input[^>]*id="pCode"[^>]*></div>'
              new = '<div class="field"><label>Ürün Kodu</label><div class="scan-input"><input id="pCode" placeholder="Kodu okut veya yaz"><button onclick="scanTo(\'pCode\')" title="Ürün kodunu okut">▣</button></div></div>'
              s2, n = re.subn(pat, new, s, count=1)
              if n != 1:
                  raise SystemExit('Beklenen Ürün Kodu alanı bulunamadı.')
              p.write_text(s2, encoding='utf-8')
              print('Ürün kodu tarayıcı alanı eklendi.')
          PY
      - name: Degisikligi yayinla
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Ürün kodu tarayıcı desteği [urun-kodu-tarayici]"
          git push
