name: Kamera akis kalici duzelt

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[kamera-akis-v2]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kamera butonlarini ve okuyucuyu kalici ekle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Eski dinamik tarayici yamalarini kaldir.
          s=re.sub(r'<script id="KANSAN_PRODUCT_SCANNER_FIX_V1">.*?</script>', '', s, flags=re.S)
          s=re.sub(r'<script id="KANSAN_DEPOT_FLOW_FIX_V1">.*?</script>', '', s, flags=re.S)
          s=re.sub(r'<script id="KANSAN_DEPOT_FLOW_FIX_V2">.*?</script>', '', s, flags=re.S)

          css='''\n.scanrow{display:flex;gap:8px;align-items:stretch;width:100%}.scanrow input{flex:1;min-width:0}.scanbtn{width:56px;min-width:56px;border:0;border-radius:11px;background:#e8efef;color:#173b4c;font-size:22px;font-weight:800;display:grid;place-items:center;cursor:pointer}.scanbtn:active{transform:scale(.97)}\n'''
          if '.scanrow{' not in s:
              s=s.replace('</style>', css+'</style>', 1)

          def replace_input(id_, placeholder=None):
              nonlocal_dummy=None
              pattern=rf'<input id="{re.escape(id_)}"([^>]*)>'
              m=re.search(pattern,s)
              return m

          targets={
            'eBarcode':'Ürün barkodunu okut','eLocation':'Raf barkodunu okut',
            'tBarcode':'Ürün barkodunu okut','tFrom':'Kaynak rafı okut','tTo':'Hedef rafı okut',
            'mBarcode':'Ürün barkodunu okut','mFrom':'Çıkış rafını okut',
            'lQuery':'Raf barkodunu okut','sQuery':'Ürün barkodu veya kodunu okut',
            'pBarcode':'Ürün barkodunu okut'
          }
          for id_,label in targets.items():
              # Zaten literal scanrow içindeyse geç.
              if re.search(rf'<div class="scanrow">\s*<input id="{re.escape(id_)}"',s):
                  continue
              pat=rf'<input id="{re.escape(id_)}"([^>]*)>'
              def repl(m,id_=id_,label=label):
                  inp=m.group(0)
                  return f'<div class="scanrow">{inp}<button class="scanbtn" type="button" onclick="scanTo(\'{id_}\')" title="{label}" aria-label="{label}">📷</button></div>'
              s,n=re.subn(pat,repl,s,count=1)
              print(id_, 'patched' if n else 'not-found')

          # Ürün kodu alanındaki eski bozuk wrapperı temizleyip düzgün tarayıcı yap.
          s=re.sub(r'<div class="scan-input">\s*<input id="pCode"([^>]*)>\s*<button[^>]*>.*?</button>\s*</div>',
                   r'<div class="scanrow"><input id="pCode"\1><button class="scanbtn" type="button" onclick="scanTo(\'pCode\')" title="Ürün kodunu okut" aria-label="Ürün kodunu okut">📷</button></div>',s,count=1,flags=re.S)
          if not re.search(r'<div class="scanrow">\s*<input id="pCode"',s):
              s=re.sub(r'<input id="pCode"([^>]*)>',r'<div class="scanrow"><input id="pCode"\1><button class="scanbtn" type="button" onclick="scanTo(\'pCode\')" title="Ürün kodunu okut" aria-label="Ürün kodunu okut">📷</button></div>',s,count=1)

          scanner=r'''<script id="KANSAN_REAL_SCANNER_V2">
          let __kScanStream=null,__kScanTimer=null,__kScanOverlay=null;
          function closeKansanScanner(){
            if(__kScanTimer){clearInterval(__kScanTimer);__kScanTimer=null;}
            if(__kScanStream){__kScanStream.getTracks().forEach(t=>t.stop());__kScanStream=null;}
            if(__kScanOverlay){__kScanOverlay.remove();__kScanOverlay=null;}
          }
          async function scanTo(targetId){
            const target=document.getElementById(targetId);if(!target)return;
            if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert('Bu tarayıcı kamera erişimini desteklemiyor.');return;}
            if(!('BarcodeDetector' in window)){alert('Bu telefondaki tarayıcı barkod algılamayı desteklemiyor. Chrome ile açmayı dene.');return;}
            closeKansanScanner();
            const ov=document.createElement('div');__kScanOverlay=ov;
            ov.style.cssText='position:fixed;inset:0;background:rgba(6,20,27,.92);z-index:99999;display:flex;flex-direction:column;padding:18px;color:white';
            ov.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b>Barkodu okut</b><button id="kScanClose" style="border:0;background:white;color:#173b4c;border-radius:10px;padding:10px 14px;font-weight:800">Kapat</button></div><video id="kScanVideo" autoplay playsinline style="width:100%;max-height:70vh;object-fit:cover;border-radius:14px;background:#111"></video><div style="padding:12px 2px;font-size:13px;color:#c8d5da">Barkodu kameraya göster.</div>';
            document.body.appendChild(ov);document.getElementById('kScanClose').onclick=closeKansanScanner;
            try{
              __kScanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
              const video=document.getElementById('kScanVideo');video.srcObject=__kScanStream;
              const detector=new BarcodeDetector();
              __kScanTimer=setInterval(async()=>{try{const codes=await detector.detect(video);if(codes&&codes.length){target.value=codes[0].rawValue||'';target.dispatchEvent(new Event('input',{bubbles:true}));closeKansanScanner();}}catch(e){}},250);
            }catch(e){closeKansanScanner();alert('Kamera açılamadı. Tarayıcı kamera iznini kontrol et.');}
          }
          </script>'''
          s=re.sub(r'<script id="KANSAN_REAL_SCANNER_V2">.*?</script>','',s,flags=re.S)
          s=s.replace('</body>',scanner+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Degisikligi yayinla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add index.html
          git commit -m "Stok girisi ve transfer kamera akisini kalici duzelt [kamera-akis-v2]"
          git push
