name: Fix v18 verification
on:
  push:
    paths:
      - '.github/workflows/fix-v18-check.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix verification condition
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/apply-v18-shelf-query.yml')
          s=p.read_text()
          old="assert 'transportUnits' not in s"
          new="assert 'function tbQty' not in s"
          if old not in s:
              raise SystemExit('verification line not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apply-v18-shelf-query.yml
          git commit -m 'fix: v18 doğrulama koşulu'
          git push
