name: Kamera duzeltmesi son temizlik

on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  clean:
    if: "!contains(github.event.head_commit.message, '[kamera-clean]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          s=s.replace("onclick=\"scanTo(\\\\'pCode\\\\')\"","onclick=\"scanTo('pCode')\"")
          s=re.sub(r'<script id="KANSAN_DEPO_AKIS_V1">.*?</script>','',s,flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add index.html
          git commit -m "Kamera akisi son temizlik [kamera-clean]"
          git push
